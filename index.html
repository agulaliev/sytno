}

  --accent:#E25A6F; --accent-ink:#1C0D10; --accent-soft:#3B1D24;
  --herb:#7CBB8D; --herb-soft:#1D3325; --warn:#E5A24C; --warn-soft:#382916; --danger:#F07A80; --danger-soft:#3D1C1F;
  color-scheme:dark}}

  --bg:#111512; --surface:#191F1B; --surface-2:#232B25; --ink:#E6EBE4; --muted:#98A59B; --line:#2E3832;
  --accent:#E25A6F; --accent-ink:#1C0D10; --accent-soft:#3B1D24;
  --herb:#7CBB8D; --herb-soft:#1D3325; --warn:#E5A24C; --warn-soft:#382916; --danger:#F07A80; --danger-soft:#3D1C1F;

html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

.desc{color:var(--muted);margin-top:6px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.linkish{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:600;text-align:left}
.linkish:hover{color:var(--accent)}
.day{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dt{font-variant-numeric:tabular-nums;text-align:center;padding-top:2px}
.day .dt b{display:block;font-family:var(--display);font-size:20px;line-height:1}
.day .dt span{font-size:12px;color:var(--muted)}
.day.today .dt b{color:var(--accent)}
.day .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.dline{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sub{font-size:13px;color:var(--muted)}

.tl{display:grid;grid-template-columns:46px 1fr;gap:6px 10px;margin-top:10px;font-size:14px}
.tl .t{font-variant-numeric:tabular-nums;color:var(--muted)}
.tl .pass{color:var(--muted);font-style:italic}
.shop{list-style:none;margin:0;padding:0}

.prices summary{cursor:pointer}
.shop li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}

.shop li.done .nm{text-decoration:line-through;color:var(--muted)}
.sec{margin-top:12px}

.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}

.addrow{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs .inner{display:flex;max-width:560px;margin:0 auto;gap:2px}
nav.tabs button{flex:1;min-width:0;font-size:12px;font-weight:600;padding:11px 2px;border:0;background:none;color:var(--muted);border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

dialog#sheet{border:0;padding:0;width:calc(100% - 24px);max-width:560px;border-radius:20px;background:var(--surface);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(8,12,9,.55)}
.sheet-in{padding:18px;max-height:82vh;overflow:auto}
.sheet-x{float:right;margin:-4px -4px 0 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.tip ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
textarea.copy{width:100%;min-height:160px;font:13px/1.5 var(--body);border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}
.btn.wide{flex:1 1 100%;padding:13px 16px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
#toast{display:flex;gap:14px;align-items:center}
.toast-undo{background:none;border:0;color:var(--bg);font-size:14px;font-weight:600;text-decoration:underline;padding:0;flex:none}
select{font:inherit;font-size:14px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-left:4px}
dialog#cook{border:0;padding:0;margin:0;width:100%;height:100%;max-width:100%;max-height:100%;background:var(--bg);color:var(--ink)}
dialog#cook::backdrop{background:var(--bg)}
.cook-in{min-height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.cook-top{display:flex;gap:12px;align-items:flex-start}
.cook-top .grow{flex:1;min-width:0}
.cook-body{flex:1}
.cook-step{font-size:21px;line-height:1.45;font-weight:500;margin:0}
.help{font-size:14px}
.help dl{margin:4px 0 0}
.help dt{font-weight:600;margin-top:10px}
.help dd{margin:2px 0 0;color:var(--muted)}
.help ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cook-nav{display:flex;gap:10px}
.cook-nav .btn{flex:1;padding:16px;font-size:17px;border-radius:14px}
.cook-timers{display:flex;flex-direction:column;gap:8px}
.cook-timers:empty{display:none}
.timer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer b{font-size:22px;font-weight:600}
.timer .tx{margin-left:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.timer.ring{background:var(--accent);color:var(--accent-ink);border:0;font-size:17px;font-weight:600;justify-content:center;padding:16px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.timer.ring{animation:none}}
</style>

</head>

{id:'gulyash',name:'Гуляш из говядины',kind:'batch',cui:'Домашняя',tool:'мультиварка',active:15,total:110,serves:4.02,keep:2,prot:47,
 desc:'Мягкая говядина в томатно-сметанной подливе, к ней макароны. Мультиварка тушит сама полтора часа.',
 ings:[['beef',800,'г'],['onion',2,'шт'],['carrot',1,'шт'],['tomato_paste',2,'ст.л.'],['smetana',150,'г'],['garlic',2,'зубч.'],['paprika',1,'ч.л.'],['oil',1,'ст.л.'],['pasta',420,'г']],
 steps:['Говядину промой, обсуши бумажным полотенцем и срежь белые плёнки. Нарежь кубиками по 3 см, примерно с грецкий орех. Режь поперёк волокон — так мясо получится мягче.','Лук нарежь полукольцами, морковь натри на крупной тёрке.','Мультиварка, режим «Жарка», крышка открыта. Налей масло, подожди 2 минуты, выложи мясо одним слоем. Через 5 минут, когда низ посветлеет и появится румянец, перемешай и добавь лук с морковью ещё на 5 минут.','Добавь томатную пасту, паприку, {1} ч.л. соли и {400} мл горячей воды, перемешай. Вода должна почти закрыть мясо.','Закрой крышку, режим «Тушение» на 1,5 часа. Можно уходить.','За 10 минут до конца открой, вмешай сметану и давленый чеснок, закрой обратно. Мясо готово, когда легко разламывается ложкой.','Макароны вари в отдельной кастрюле. Налей в большую кастрюлю {4c} л воды, накрой крышкой и поставь на сильный огонь — под крышкой закипит быстрее. Когда вода забурлит, добавь {4c} ч.л. соли и всыпь макароны — {420} г. Первую минуту помешивай, чтобы они не слиплись, дальше вари без крышки столько минут, сколько написано на пачке. За минуту до конца выложи одну макаронину и попробуй: мягкая, но чуть упругая в середине — готово. Гуляш и макароны храни в разных контейнерах, чтобы макароны не раскисли.'],
 fix:['Мясо жёсткое после 1,5 часа — добавь 100 мл воды и потуши ещё 30 минут. Говядина просто разная, иногда ей нужно больше времени.','Подлива жидкая — открой крышку и оставь на «Жарке» 5–7 минут, помешивая.','Пересолил — добавь ещё сметаны и 100 мл воды, макароны в этом случае почти не соли.','Сметана свернулась хлопьями — на вкус это не влияет. В следующий раз клади её только в конце и не давай кипеть долго.'],
 prep:[[0,10,'Гуляш: нарезать мясо, лук, морковь',1],[10,8,'Гуляш: обжарить, залить водой с пастой, включить «Тушение» 1,5 ч',1],[18,85,'Гуляш тушится сам',0],[103,12,'Гуляш: вмешать сметану и чеснок, сварить макароны',1]]},
{id:'plov',name:'Плов с говядиной',kind:'batch',cui:'Кавказская',tool:'мультиварка',active:20,total:80,serves:4.02,keep:2,prot:33,
 desc:'Рассыпчатый рис, говядина, много моркови и целая головка чеснока. В мультиварке на режиме «Плов».',
 ings:[['beef',600,'г'],['rice',400,'г'],['carrot',3,'шт'],['onion',2,'шт'],['garlic',1,'головка'],['zira',1,'ч.л.'],['oil',3,'ст.л.']],
 steps:['Говядину нарежь кубиками по 2 см, примерно как фаланга пальца. Лук — полукольцами. Морковь — соломкой толщиной со спичку или на крупной тёрке.','Мультиварка, режим «Жарка». Налей масло, подожди 2 минуты, выложи мясо и лук. Жарь 10 минут, время от времени помешивая, пока мясо не станет коричневым со всех сторон.','Добавь морковь, {1,5} ч.л. соли и зиру (разотри её в пальцах — так ярче запах). Жарь ещё 5 минут, пока морковь не станет мягкой.','Рис положи в миску, залей холодной водой, потри руками и слей. Повтори 4–5 раз, пока вода не станет почти прозрачной.','Высыпь рис ровным слоем поверх мяса и разровняй ложкой. Не перемешивай с мясом. Головку чеснока не чисть, только сними верхнюю шелуху и воткни в центр.','Аккуратно, по ложке, налей горячую воду так, чтобы она была на 1,5 см выше риса — примерно на толщину пальца. Режим «Плов» или «Крупа». Можно уходить.','После сигнала перемешай и дай постоять 10 минут с закрытой крышкой. Чеснок можно выдавить из шелухи прямо в тарелку.'],
 fix:['Рис сырой и твёрдый — влей 100 мл кипятка и включи «Плов» ещё раз или «Тушение» на 15 минут.','Получилась каша — было много воды или рис мешали до варки. В следующий раз вода ровно на палец выше риса.','Подгорело дно — не скреби горелое, переложи верхнюю часть в контейнер. В следующий раз добавь воды на 100 мл больше.','Пресно — посоли прямо в тарелке и добавь щепотку зиры.'],
 prep:[[0,8,'Плов: нарезать мясо, лук, морковь',1],[8,15,'Плов: обжарить, промыть рис, залить, включить «Плов»',1],[23,50,'Плов готовится сам',0],[73,3,'Плов: перемешать, разложить по контейнерам',1]]},
{id:'chick_potato',name:'Курица с картошкой в духовке',kind:'batch',cui:'Домашняя',tool:'духовка',active:15,total:70,serves:4.6,keep:2,prot:35,
 desc:'Как у мамы: картошка, лук и курица в сметане с чесноком. Всё в одну форму, остальное делает духовка.',
 ings:[['chicken_legs',1200,'г'],['potato',1200,'г'],['onion',2,'шт'],['smetana',150,'г'],['garlic',4,'зубч.'],['paprika',1,'ч.л.'],['oil',2,'ст.л.']],
 steps:['Включи духовку на 200°, чтобы она прогрелась, пока режешь.','Картошку почисть и разрежь каждую на 4–6 крупных долек, как дольки апельсина. Лук нарежь кольцами толщиной 3–4 мм.','Сложи картошку и лук в форму, посыпь {0,5} ч.л. соли, полей маслом и перемешай руками, чтобы масло было на каждом кусочке.','В миске смешай сметану, давленый чеснок, паприку и {1} ч.л. соли. Обмажь этим каждый кусок курицы со всех сторон.','Выложи курицу кожей вверх поверх картошки. Форму поставь на средний уровень духовки на 50 минут и не открывай.','Проверь готовность: проткни картошку ножом — он входит легко. Надрежь курицу у кости — сок прозрачный, без розового. Если розовый, верни ещё на 10 минут.'],
 fix:['Картошка ещё твёрдая, а курица уже румяная — накрой форму фольгой и запекай ещё 10–15 минут.','Курица подгорает сверху — накрой фольгой и убавь до 180°.','Много жидкости в форме — это сок, он вкусный. Полей им картошку при подаче.','Картошка сухая на следующий день — сбрызни водой перед разогревом и накрой тарелкой.'],
 prep:[[0,15,'Курица с картошкой: нарезать, обмазать, сложить в форму',1],[15,50,'Курица с картошкой в духовке, 200°',0],[65,5,'Курица с картошкой: остудить, разложить',1]]},
{id:'tefteli',name:'Тефтели в томатно-сметанной подливе',kind:'batch',cui:'Домашняя',tool:'духовка',active:25,total:75,serves:4.6,keep:2,prot:38,
 desc:'Фарш с рисом, запечённый в подливе. Без жарки: 20 минут в духовке, потом заливаешь соусом.',
 ings:[['mince',800,'г'],['rice',80,'г'],['onion',2,'шт'],['eggs',1,'шт'],['tomato_paste',2,'ст.л.'],['smetana',200,'г'],['garlic',2,'зубч.'],['buckwheat',480,'г']],
 steps:['{80} г риса промой и отвари в небольшой кастрюле 10 минут (он будет полуготовым). Слей воду и остуди. Включи духовку на 200°.','Натри на мелкой тёрке {1h|луковицу|луковицы|луковиц}. Смешай в миске фарш, лук, рис, яйцо и {1} ч.л. соли. Вымешивай рукой 2 минуты, пока масса не станет однородной и липкой.','Смочи руки водой и скатай шарики размером с грецкий орех или чуть больше — получится {16|шарик|шарика|шариков}. Выложи их в форму рядом друг с другом.','Поставь форму в духовку на 20 минут — тефтели схватятся и подрумянятся.','Пока запекаются: остальной лук нарежь мелко. Смешай со сметаной, томатной пастой, давленым чесноком, щепоткой соли и {300} мл воды.','Достань форму, залей тефтели соусом — он должен закрыть их наполовину. Верни в духовку ещё на 25 минут.','Параллельно свари гарнир. Насыпь гречку в сито — {480} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {960} мл холодной воды — в 2 раза больше, чем крупы, — добавь {1,5} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 20 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут.'],
 fix:['Тефтели разваливаются — фарш был слишком жидкий. Добавь в него ложку муки или овсяных хлопьев и вымешай ещё раз.','Соус выкипел и тефтели подсохли — подлей 100 мл горячей воды и верни в духовку на 5 минут.','Соус кислый — добавь ещё ложку сметаны.','Внутри розовое — запекай ещё 10 минут. Фарш должен быть серым внутри.'],
 prep:[[0,12,'Тефтели: отварить рис, натереть лук',1],[12,13,'Тефтели: замесить фарш, скатать, в духовку',1],[25,20,'Тефтели запекаются',0],[45,5,'Тефтели: залить соусом',1],[50,25,'Тефтели томятся в соусе',0],[75,3,'Тефтели: разложить по контейнерам',1]]},
{id:'chakhokhbili',name:'Чахохбили',kind:'batch',cui:'Кавказская',tool:'плита',active:20,total:65,serves:4.02,keep:2,prot:42,
 desc:'Грузинская курица, тушённая с луком и помидорами. Хмели-сунели и чеснок, без остроты.',
 ings:[['chicken_legs',1200,'г'],['onion',3,'шт'],['canned_tomatoes',1,'банка'],['garlic',4,'зубч.'],['khmeli',2,'ч.л.'],['greens',1,'пучок'],['rice',420,'г']],
 steps:['Если курица целыми окорочками, разрежь каждый по суставу на бедро и голень: нащупай сустав ножом, там он режется легко. Лук нарежь полукольцами.','Поставь сотейник или глубокую сковороду на средний огонь без масла. Выложи курицу кожей вниз и жарь 10 минут, пока кожа не станет золотистой. Жир вытопится сам.','Переверни курицу, добавь лук и жарь 5 минут, пока он не станет мягким и прозрачным.','Открой банку томатов, выложи их в сотейник и раздави ложкой. Добавь хмели-сунели и {1} ч.л. соли, перемешай.','Накрой крышкой, убавь огонь до слабого — соус должен еле булькать. Туши 30 минут, мешать не нужно. В мультиварке: всё то же на «Жарке», потом «Тушение» 40 минут.','Курица готова, когда мясо легко отходит от кости. В конце добавь давленый чеснок и рубленую зелень, выключи и дай постоять 5 минут.','Параллельно свари гарнир. Насыпь рис в сито — {420} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {840} мл холодной воды — в 2 раза больше, чем крупы, — добавь {1,25} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 18 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут.'],
 fix:['Курица прилипла к сковороде — не отрывай силой. Подожди 2–3 минуты, кожа зарумянится и отойдёт сама.','Соус слишком жидкий — сними крышку и покипяти 10 минут на среднем огне.','Соус кислый — добавь щепотку соли и кусочек сливочного масла, кислинка смягчится.','Пригорает снизу — огонь был сильный. Подлей 100 мл воды и убавь огонь.'],
 prep:[[0,8,'Чахохбили: разрезать курицу, нарезать лук',1],[8,15,'Чахохбили: обжарить курицу и лук, добавить томаты',1],[23,30,'Чахохбили тушится под крышкой',0],[53,6,'Чахохбили: чеснок, зелень, разложить',1]]},
{id:'kotlety',name:'Котлеты из индейки в духовке',kind:'batch',cui:'Домашняя',tool:'духовка',active:20,total:45,serves:3.45,keep:2,prot:51,yields:'cutlets',pcs:12,
 desc:'Почти как покупные, только свои. Без жарки, на пергаменте. Лишние можно заморозить сырыми.',
 ings:[['turkey_mince',900,'г'],['onion',1,'шт'],['eggs',1,'шт'],['oats',3,'ст.л.'],['garlic',2,'зубч.'],['smetana',100,'г'],['buckwheat',360,'г']],
 steps:['Включи духовку на 200°. Застели противень пергаментом (бумагой для выпечки).','Лук натри на мелкой тёрке. В миске смешай фарш, лук с соком, яйцо, овсяные хлопья, давленый чеснок и {1} ч.л. соли.','Вымешай рукой 2 минуты и оставь на 5 минут, чтобы хлопья набухли. Так котлеты не развалятся.','Смочи руки холодной водой, возьми фарш размером с крупное яйцо, скатай шар и прижми ладонями в котлету толщиной 2 см. Получится {12|штука|штуки|штук}.','Выложи на пергамент на расстоянии пальца друг от друга. 25 минут в духовке, переворачивать не нужно.','Пока котлеты в духовке, свари гарнир. Насыпь гречку в сито — {360} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {720} мл холодной воды — в 2 раза больше, чем крупы, — добавь {1,25} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 20 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут.','Котлета готова, когда сверху румяная, а на разрезе белая, без розового.','Лишние сырые котлеты разложи на доске, заморозь 2 часа, потом пересыпь в пакет. Так они не слипнутся.'],
 fix:['Фарш липнет к рукам — чаще смачивай руки холодной водой.','Котлеты расплываются — добавь ещё ложку хлопьев и подожди 5 минут.','Котлеты сухие — в следующий раз не держи дольше 25 минут. Сейчас подавай с соусом: сметана с чесноком.','Снизу прилипли к бумаге — дай остыть 5 минут, потом снимай лопаткой.'],
 prep:[[0,8,'Котлеты: натереть лук, замесить фарш',1],[8,10,'Котлеты: слепить, в духовку',1],[18,25,'Котлеты запекаются',0],[43,5,'Котлеты: остудить, в контейнер',1]]},
{id:'podliva',name:'Рис с куриной подливой',kind:'batch',cui:'Домашняя',tool:'мультиварка',active:15,total:55,serves:3.45,keep:2,prot:44,
 desc:'Тот самый рис с мясной подливой. Куриное бедро, лук, морковь, сметана и томат.',
 ings:[['chicken_thigh',800,'г'],['onion',2,'шт'],['carrot',1,'шт'],['tomato_paste',2,'ст.л.'],['smetana',150,'г'],['flour',1,'ст.л.'],['garlic',2,'зубч.'],['rice',360,'г']],
 steps:['Куриные бёдра нарежь кусочками по 2–3 см. Если есть кожа, можно оставить. Лук нарежь мелко, морковь натри на крупной тёрке.','Мультиварка, режим «Жарка». Выложи курицу и жарь 5 минут, помешивая, пока мясо не станет белым. Добавь лук и морковь ещё на 5 минут.','Посыпь мукой и сразу перемешай, чтобы не было комков. Добавь томатную пасту, {1} ч.л. соли и {400} мл воды, перемешай ещё раз.','Закрой крышку, режим «Тушение» на 30 минут.','В конце открой, вмешай сметану и давленый чеснок. Подлива должна быть как жидкая сметана.','Параллельно свари гарнир. Насыпь рис в сито — {360} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {720} мл холодной воды — в 2 раза больше, чем крупы, — добавь {1,25} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 18 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут. Подливу храни отдельно от риса.'],
 fix:['В подливе комочки муки — перемешай венчиком или вилкой 1 минуту, они разойдутся.','Подлива жидкая — оставь на «Жарке» без крышки на 5 минут, помешивая.','Слишком густая — добавь горячей воды по 50 мл.','Бледный вкус — добавь ещё ложку томатной пасты и щепотку соли.'],
 prep:[[0,8,'Подлива: нарезать курицу, лук, морковь',1],[8,10,'Подлива: обжарить, залить водой, «Тушение» 30 мин',1],[18,30,'Подлива тушится',0],[48,5,'Подлива: сметана, чеснок, разложить',1]]},
{id:'golubtsy',name:'Ленивые голубцы в духовке',kind:'batch',cui:'Домашняя',tool:'духовка',active:25,total:80,serves:3.45,keep:2,prot:35,
 desc:'Вкус голубцов без заворачивания. Капуста внутри, отдельно её почти не видно. Гарнир не нужен.',
 ings:[['mince',600,'г'],['rice',120,'г'],['cabbage',400,'г'],['onion',1,'шт'],['carrot',1,'шт'],['eggs',1,'шт'],['tomato_paste',2,'ст.л.'],['smetana',200,'г']],
 steps:['Рис промой и отвари 10 минут, слей воду. Капусту нашинкуй мелко — тонкими полосками, потом поперёк. Залей кипятком на 5 минут, слей и отожми руками, чтобы не было воды.','Включи духовку на 200°. Лук натри на мелкой тёрке.','Смешай фарш, рис, капусту, яйцо, лук и {1} ч.л. соли. Вымешай рукой 2 минуты.','Мокрыми руками слепи овальные котлеты размером с ладонь, всего {12|штука|штуки|штук}, и выложи в форму плотно друг к другу. 20 минут в духовке.','Пока запекаются: морковь натри на крупной тёрке, смешай со сметаной, томатной пастой и {300} мл воды.','Залей голубцы соусом и запекай ещё 25 минут. Готовы, когда соус пузырится, а внутри голубцов нет розового.'],
 fix:['Голубцы разваливаются — капуста была мокрой. Отжимай её сильнее, двумя руками.','Соус выкипел — подлей 100 мл горячей воды и верни на 5 минут.','Капуста хрустит — потоми ещё 10 минут под фольгой.','Пресно — посоли соус и добавь ложку сметаны при подаче.'],
 prep:[[0,15,'Голубцы: отварить рис, нашинковать и ошпарить капусту',1],[15,10,'Голубцы: замесить, слепить, в духовку',1],[25,20,'Голубцы запекаются',0],[45,5,'Голубцы: залить соусом',1],[50,25,'Голубцы томятся в соусе',0],[75,3,'Голубцы: разложить',1]]},
{id:'kharcho',name:'Харчо с говядиной',kind:'batch',cui:'Кавказская',tool:'мультиварка',active:15,total:100,serves:3.45,keep:2,prot:43,

 steps:['Говядину нарежь кусочками по 2 см, примерно с фалангу пальца. Сложи в чашу мультиварки и залей {2} л холодной воды.','Режим «Суп» на 1 час. Через 10 минут после начала можно открыть и снять ложкой серую пену — бульон будет прозрачнее. Дальше можно уходить.','Пока варится: лук нарежь мелко, рис промой 3–4 раза холодной водой.','Через час добавь лук, рис, томаты из банки (раздави ложкой), хмели-сунели и {1,5} ч.л. соли. Готовь ещё 25 минут, пока рис не станет мягким.','В конце добавь давленый чеснок и рубленую зелень, закрой крышку и дай настояться 10 минут.'],
 fix:['Суп слишком густой — рис впитал воду. Добавь 300 мл кипятка и посоли чуть-чуть.','Мясо жёсткое — потоми ещё 30 минут на «Тушении».','Кисловато — добавь кусочек сливочного масла в тарелку.','Пересолил — добавь 500 мл воды и ещё горсть риса, вари 15 минут.'],
 prep:[[0,5,'Харчо: нарезать мясо, залить водой, «Суп» 1 ч',1],[5,60,'Харчо: бульон варится',0],[65,5,'Харчо: добавить рис, лук, томаты, специи',1],[70,25,'Харчо доваривается',0],[95,3,'Харчо: чеснок и зелень',1]]},
{id:'grechka_kup',name:'Гречка по-купечески с курицей',kind:'batch',cui:'Домашняя',tool:'мультиварка',active:15,total:60,serves:3.45,keep:2,prot:46,

{id:'zapekanka',name:'Картофельная запеканка с фаршем',kind:'batch',cui:'Домашняя',tool:'духовка',active:25,total:65,serves:4.02,keep:2,prot:33,

 ings:[['potato',1000,'г'],['mince',600,'г'],['onion',1,'шт'],['cheese',100,'г'],['smetana',100,'г'],['butter',30,'г'],['eggs',1,'шт']],
 steps:['Картошку почисть и разрежь на 4 части. Положи в кастрюлю, залей холодной водой так, чтобы она закрыла картошку, добавь {1} ч.л. соли и вари 20 минут после закипания на среднем огне.','Пока варится: лук нарежь мелко. Фарш и лук выложи на сухую сковороду, средний огонь, 10 минут. Разбивай фарш лопаткой на мелкие крошки, пока он не станет серым. Посоли ({0,5} ч.л.).','Картошка готова, когда нож входит легко. Слей воду, добавь масло, сметану и яйцо, разомни толкушкой или вилкой в пюре. Включи духовку на 200°.','В форму выложи половину пюре и разровняй ложкой. Сверху весь фарш, потом остальное пюре.','Сыр натри на крупной тёрке и посыпь сверху. 20 минут в духовке, пока сыр не станет золотистым.','Дай постоять 10 минут — так запеканка не развалится при нарезке.'],
 fix:['Пюре жидкое — не страшно, запеканка всё равно схватится. В следующий раз хорошо сливай воду.','Сыр подгорает — накрой фольгой.','Разваливается при нарезке — дай остыть ещё 10 минут.','Фарш выделил много воды — жарь без крышки, пока вода не выпарится.'],
 prep:[[0,10,'Запеканка: почистить картошку, поставить вариться',1],[10,20,'Картошка варится',0],[12,10,'Запеканка: обжарить фарш с луком',1],[30,10,'Запеканка: пюре, собрать слоями, в духовку',1],[40,20,'Запеканка в духовке',0],[60,3,'Запеканка: остудить, нарезать',1]]},
{id:'zharkoe',name:'Жаркое с говядиной',kind:'batch',cui:'Домашняя',tool:'мультиварка',active:20,total:115,serves:2.88,keep:2,prot:50,
 desc:'Говядина и картошка, томлённые в своём соку. Весь ужин в одной чаше.',
 ings:[['beef',700,'г'],['potato',1000,'г'],['onion',2,'шт'],['carrot',1,'шт'],['tomato_paste',1,'ст.л.'],['garlic',3,'зубч.']],
 steps:['Говядину нарежь кубиками по 3 см, примерно с грецкий орех. Лук нарежь полукольцами, морковь кружками толщиной 5 мм.','Картошку почисти и нарежь крупными кусками, примерно на 4 части каждую.','Мультиварка, режим «Жарка». Мясо жарь 5 минут, помешивая, потом добавь лук и морковь ещё на 5 минут.','Сверху выложи картошку, томатную пасту, {1,5} ч.л. соли и {500} мл воды. Перемешивать не обязательно.','Закрой крышку, режим «Тушение» на 1,5 часа. Можно уходить.','В конце добавь давленый чеснок и аккуратно перемешай. Готово, когда мясо легко делится ложкой.'],
 fix:['Картошка развалилась в пюре — нарезка была мелкой. На вкус нормально, в следующий раз режь крупнее.','Мясо жёсткое — ещё 30 минут «Тушения», подлей 100 мл воды.','Жидко — открой крышку и оставь на «Жарке» 5 минут.','Пресно — посоли и добавь лавровый лист в следующий раз.'],
 prep:[[0,12,'Жаркое: нарезать мясо и овощи',1],[12,10,'Жаркое: обжарить, загрузить картошку, «Тушение» 1,5 ч',1],[22,90,'Жаркое тушится само',0],[112,3,'Жаркое: чеснок, разложить',1]]},
{id:'chkmeruli',name:'Чкмерули',kind:'quick',cui:'Кавказская',tool:'плита',active:15,total:25,serves:2.3,keep:1,prot:41,
 desc:'Курица в сливочно-чесночном соусе по-грузински. Чеснока много, остроты нет.',
 ings:[['chicken_thigh',500,'г'],['cream',200,'мл'],['garlic',5,'зубч.'],['butter',15,'г'],['greens',1,'пучок'],['rice',240,'г']],
 steps:['Сначала поставь гарнир. Насыпь рис в сито — {240} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {480} мл холодной воды — в 2 раза больше, чем крупы, — добавь {0,75} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 18 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут.','Бёдра посоли с обеих сторон. Чеснок раздави, зелень мелко поруби.','Сковороду поставь на средний огонь и растопи масло. Выложи бёдра кожей вниз, накрой крышкой на 6 минут, пока низ не станет золотистым.','Переверни и держи ещё 6 минут под крышкой. Надрежь самое толстое место — сок прозрачный, мясо белое.','Влей сливки, добавь чеснок. Убавь огонь до слабого и держи 5 минут без крышки, пока соус не загустеет.','Посыпь зеленью и подавай с рисом.'],
 fix:['Сливки свернулись — огонь был сильный. На вкус почти не влияет, в следующий раз держи слабый.','Соус жидкий — подержи ещё 3–4 минуты без крышки.','Курица внутри розовая — накрой крышкой и оставь ещё на 5 минут.','Рис прилип — в следующий раз не мешай его во время варки.']},
{id:'flot',name:'Макароны по-флотски',kind:'quick',cui:'Домашняя',tool:'плита',active:15,total:25,serves:2.3,keep:1,prot:32,
 desc:'Классика за 25 минут: фарш с луком и макароны в одной сковороде.',
 ings:[['mince',400,'г'],['pasta',240,'г'],['onion',1,'шт'],['tomato_paste',1,'ст.л.'],['cheese',40,'г']],
 steps:['Налей в большую кастрюлю {2,5c} л воды, накрой крышкой и поставь на сильный огонь — под крышкой закипит быстрее. Когда вода забурлит, добавь {2,5c} ч.л. соли и всыпь макароны — {240} г. Первую минуту помешивай, чтобы они не слиплись, дальше вари без крышки столько минут, сколько написано на пачке. За минуту до конца выложи одну макаронину и попробуй: мягкая, но чуть упругая в середине — готово.','Лук нарежь мелко. Фарш и лук выложи на сухую сковороду, средний огонь.','Жарь 10 минут, разбивая фарш лопаткой на мелкие крошки, пока он не станет серо-коричневым.','Добавь томатную пасту, {0,5} ч.л. соли и {3} ст.л. воды из кастрюли с макаронами. Перемешай.','Слей макароны, переложи в сковороду с фаршем и перемешай. Сверху натри сыр.'],
 fix:['Фарш крупными комками — разбивай его лопаткой сразу, пока он сырой.','Сухо — добавь ещё 3–4 ложки воды из-под макарон.','Макароны слиплись — в следующий раз мешай их в первые 2 минуты варки.','Фарш выделил воду — жарь без крышки, пока вода не выпарится.']},
{id:'turkey_cream',name:'Индейка в сливочно-сырном соусе',kind:'quick',cui:'Домашняя',tool:'плита',active:15,total:20,serves:2.3,keep:1,prot:45,
 desc:'Нежная индейка кусочками, сливки и плавленый сыр. С макаронами.',
 ings:[['turkey',450,'г'],['cream',150,'мл'],['processed_cheese',1,'шт'],['garlic',2,'зубч.'],['pasta',240,'г'],['oil',1,'ст.л.']],
 steps:['Налей в большую кастрюлю {2,5c} л воды, накрой крышкой и поставь на сильный огонь — под крышкой закипит быстрее. Когда вода забурлит, добавь {2,5c} ч.л. соли и всыпь макароны — {240} г. Первую минуту помешивай, чтобы они не слиплись, дальше вари без крышки столько минут, сколько написано на пачке. За минуту до конца выложи одну макаронину и попробуй: мягкая, но чуть упругая в середине — готово.','Индейку нарежь кусочками по 2 см. Чеснок раздави.','Сковороду с маслом поставь на сильный огонь, подожди 1 минуту. Выложи индейку и жарь 7 минут, помешивая, пока кусочки не побелеют со всех сторон. Посоли.','Убавь огонь до среднего. Влей сливки, положи плавленый сыр (порежь его на кусочки) и чеснок.','Мешай 3 минуты, пока сыр не растает и соус не станет гладким.','Слей макароны и смешай с соусом прямо в сковороде.'],
 fix:['Индейка сухая — жарил дольше 7 минут. В следующий раз режь крупнее и не пережаривай.','Сыр не тает — убавь огонь и мешай ещё 2 минуты.','Соус густой — добавь 3–4 ложки воды из-под макарон.','Пресно — посоли и поперчи в тарелке.']},
{id:'chirbuli',name:'Чирбули: яйца с помидорами',kind:'quick',cui:'Кавказская',tool:'плита',active:15,total:15,serves:1.15,keep:1,prot:31,
 desc:'Грузинская яичница: лук и помидоры, сверху яйца. Подходит и для позднего ужина.',
 ings:[['eggs',5,'шт'],['tomatoes',3,'шт'],['onion',1,'шт'],['garlic',1,'зубч.'],['butter',15,'г'],['greens',1,'пучок']],
 steps:['Лук нарежь мелко. Помидоры нарежь кубиками по 1 см.','Растопи масло на сковороде на среднем огне. Выложи лук и жарь 4 минуты, пока он не станет прозрачным и мягким.','Добавь помидоры и {0,5} ч.л. соли. Жарь ещё 5 минут, помешивая, пока помидоры не превратятся в густой соус.','Сделай ложкой в соусе {5|ямку|ямки|ямок} и разбей в каждую по яйцу.','Накрой крышкой и держи 4 минуты на слабом огне — белок станет белым, желток останется мягким.','Сверху раздави чеснок и посыпь рубленой зеленью.'],
 fix:['Белок сверху сырой — накрой крышкой ещё на 1–2 минуты.','Соус водянистый — помидоры были сочные. Подержи их дольше до яиц.','Пригорает — убавь огонь и подлей 2 ложки воды.','Желтки затвердели — передержал. На вкус нормально, в следующий раз 3 минуты.']},
{id:'stroganoff',name:'Бефстроганов из индейки',kind:'quick',cui:'Домашняя',tool:'плита',active:15,total:25,serves:2.3,keep:1,prot:44,

 steps:['Сначала поставь гарнир. Насыпь гречку в сито — {240} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {480} мл холодной воды — в 2 раза больше, чем крупы, — добавь {0,75} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 20 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут.','Индейку нарежь полосками толщиной с палец и длиной 4–5 см. Лук нарежь полукольцами.','Разогрей масло на сковороде на среднем огне. Лук жарь 4 минуты, пока не станет мягким.','Прибавь огонь до сильного, добавь индейку и жарь 6 минут, помешивая, пока полоски не побелеют.','Добавь сметану, томатную пасту, {0,5} ч.л. соли и {100} мл воды, перемешай. Накрой крышкой на 3 минуты на слабом огне.'],
 fix:['Индейка пустила много сока и не жарится — сковорода была холодной или мяса много. Жарь без крышки, пока сок не выпарится.','Соус слишком густой — добавь ещё 50 мл воды.','Сметана свернулась — огонь сильный. На вкус почти не влияет.','Гречка не доварилась — добавь 50 мл кипятка и ещё 5 минут под крышкой.']},
{id:'lyulya',name:'Люля-кебаб в духовке',kind:'quick',cui:'Кавказская',tool:'духовка',active:15,total:30,serves:2.3,keep:1,prot:39,

 steps:['Включи духовку на 220°, застели противень пергаментом. Сначала поставь гарнир. Насыпь рис в сито — {240} г — и промой под краном холодной водой: держи сито над раковиной и перемешивай крупу рукой 30 секунд, пока вода снизу не станет почти прозрачной. Встряхни сито, чтобы стекла вода, и пересыпь крупу в кастрюлю. Залей {480} мл холодной воды — в 2 раза больше, чем крупы, — добавь {0,75} ч.л. соли и поставь на сильный огонь. Когда закипит, убавь до самого слабого, накрой крышкой и вари 18 минут — не открывай и не мешай. Потом выключи и дай постоять под крышкой 5 минут.','Лук натри на мелкой тёрке и отожми сок руками над раковиной — иначе люля расплывутся.','Смешай фарш, лук, зиру и {1} ч.л. соли. Вымешивай рукой 2 минуты, можно побросать фарш в миску несколько раз — он станет плотнее.','Смочи руки холодной водой, слепи вытянутые колбаски толщиной в 2 пальца, всего {6|штука|штуки|штук}, и выложи на противень.','15 минут в духовке. Готовы, когда сверху румяные, а внутри без розового.','Соус: сметана, давленый чеснок и щепоть соли. Огурцы нарежь кружками, зелень порви руками.'],
 fix:['Люля расплылись — лук был мокрым. В следующий раз отжимай сильнее.','Сухие — передержал. Подавай с двойной порцией соуса.','Внутри розовые — ещё 5 минут в духовке.','Пресные — добавь соль и зиру в соус.']},
{id:'cheese_chicken',name:'Курица под сыром без майонеза',kind:'quick',cui:'Домашняя',tool:'духовка',active:10,total:35,serves:2.3,keep:1,prot:52,

{id:'kotlety_kuritsa',name:'Куриные котлеты с кабачком',kind:'batch',cui:'Домашняя',tool:'духовка',active:20,total:45,serves:3.45,keep:2,prot:42,yields:'cutlets',pcs:12,

{id:'chicken_mush',name:'Курица в сливочно-грибном соусе',kind:'quick',cui:'Домашняя',tool:'плита',active:15,total:25,serves:2.3,keep:1,prot:42,

function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}

function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return String(v).replace('.',',')}
function fmtQty(q,u){
  if(u==='г'||u==='мл'){let v=q<100?Math.round(q/10)*10:Math.round(q/50)*50;if(!v)v=10;
    if(v>=1000)return num(Math.round(v/100)/10)+(u==='г'?' кг':' л');return v+' '+u}

  if(k==='garlic'&&u==='зубч.')return priceOf('garlic')/10;
  if(!PRICE[k])return u==='ч.л.'?4:1;
  const p=priceOf(k);
  if(u==='г'||u==='мл')return p/1000;
  if(SPOON[u]&&SPOON[u][k])return p*SPOON[u][k]/1000;
  if(u==='шт'&&PCS[k])return p*PCS[k]/1000;
  return p;
}
function dishCost(d){return d.ings.reduce((s,[k,q,u])=>s+q*unitCost(k,u),0)/d.serves}
function isBanned(d){return d.ings.some(i=>state.ban.includes(i[0]))}
function isNew(d){return state.r[d.id]===undefined&&!state.c[d.id]}
function weight(d){
  if(isBanned(d)||state.r[d.id]===-1)return 0;
  let w=state.r[d.id]===1?4:isNew(d)?1.6:1;
  const lc=state.lc[d.id];if(lc&&diffDays(today(),parse(lc))<6)w*=.3;
  return w*valueMul(d);
}
const protPerRub=d=>d.prot/Math.max(30,dishCost(d));
function valueMul(d){
  if(!state.thrift||d.fixed||d.kind==='base')return 1;
  const all=DISHES.filter(x=>x.kind===d.kind).map(protPerRub).sort((a,b)=>a-b);
  return Math.min(3,Math.max(.2,Math.pow(protPerRub(d)/all[all.length>>1],2)));
}
function pick(list,exclude){
  const c=list.filter(d=>!(exclude||[]).includes(d.id)).map(d=>[d,weight(d)]).filter(x=>x[1]>0);
  if(!c.length)return null;let t=c.reduce((s,x)=>s+x[1],0)*Math.random();
  for(const [d,w] of c){if((t-=w)<=0)return d}return c[c.length-1][0];
}
function isFresh(i,t){return i.z||diffDays(parse(i.e),t||today())>=0}
function freshFridge(){const t=today();return state.fridge.filter(i=>isFresh(i,t))}
function hasKey(k){return freshFridge().some(i=>i.k===k)}
function coverage(d){const need=d.ings.filter(i=>!isPantry(i[0]));const have=need.filter(i=>hasKey(i[0]));return {need,have,miss:need.filter(i=>!hasKey(i[0])),ratio:need.length?have.length/need.length:1}}
function rid(){return Math.random().toString(36).slice(2,9)}

/* ---------- неделя ---------- */
function genWeek(){
  const batch=DISHES.filter(d=>d.kind==='batch'),quick=DISHES.filter(d=>d.kind==='quick');
  const A=pick(batch)||batch[0];
  const B=pick(batch.filter(d=>mainProtein(d)!==mainProtein(A)),[A.id])||pick(batch,[A.id])||batch[1];
  const Q1=pick(quick.filter(isNew))||pick(quick)||quick[0];
  const Q2=pick(quick.filter(d=>mainProtein(d)!==mainProtein(Q1)),[Q1.id])||pick(quick,[Q1.id])||quick[1];
  const Q3=pick(quick,[Q1.id,Q2.id])||Q1;
  const extras=['p_grain','s_eggs'];
  if(A.tool!=='духовка')extras.push(Math.random()<.65?'s_buzh':'s_muffins');
  const e=state.eaters;
  const w={start:iso(today()),slots:[
    {role:'prep',id:A.id,e},{role:'left',id:A.id,e},{role:'batch',id:B.id,e},{role:'left',id:B.id,e},
    {role:'quick',id:Q1.id,e},{role:'quick',id:Q2.id,e},{role:'spare',id:Q3.id,e}],extras,late:[],bought:{}};
  w.late=genLate(w);
  return w;
}
function readyOn(w,day){
  const out=[];
  w.extras.forEach(id=>{const d=D[id];if(d.yields&&day<=d.keep)out.push(d.yields)});
  return out;
}
function genLate(w){
  const pool=DISHES.filter(d=>!d.fixed&&(d.kind==='snack'||d.kind==='build'||d.kind==='quick'&&d.total<=15)).map(d=>d.id);
  const res=[];let prev=null;
  for(let day=0;day<7;day++){
    const ready=readyOn(w,day);
    const cands=pool.map(id=>D[id]).filter(d=>d.ings.every(i=>!isReady(i[0])||ready.includes(i[0])));
    if(w.extras.includes('s_muffins')&&day<=2)cands.push(D.s_muffins);
    const p=pick(cands,prev?[prev]:[])||pick(cands)||D.s_tvorog;res.push(p.id);prev=p.id;
  }
  return res;
}
function replaceSlot(i){
  const w=state.week;const s=w.slots[i];
  if(i<=3){
    const a=(i<=1)?0:2;const other=(a===0)?w.slots[2].id:w.slots[0].id;
    const nd=pick(DISHES.filter(d=>d.kind==='batch'),[w.slots[a].id,other]);if(!nd)return toast('Больше нечего предложить: сними пару дизлайков');
    w.slots[a].id=nd.id;w.slots[a+1].id=nd.id;
    if(a===0){w.extras=w.extras.filter(x=>x!=='s_buzh'&&x!=='s_muffins');if(nd.tool!=='духовка')w.extras.push('s_buzh');w.late=genLate(w)}
  }else{
    const nd=pick(DISHES.filter(d=>d.kind==='quick'),w.slots.map(x=>x.id));if(!nd)return toast('Больше нечего предложить');
    s.id=nd.id;
  }
  save();render();
}
function weekItems(w){
  const it=[];
  w.slots.forEach((s,day)=>{if(s.role==='left')return;const d=D[s.id];it.push({d,portions:portionsFor(d,day),day})});
  w.extras.forEach(id=>it.push({d:D[id],portions:D[id].serves,day:0}));
  w.late.forEach((id,day)=>{const d=D[id];if(id==='s_muffins')return;it.push({d,portions:1,day,late:1})});
  return it;
}
function shopping(w){
  const hyper={},local={},pantry=new Set();
  weekItems(w).forEach(({d,portions,day})=>{
    const f=portions/d.serves;
    d.ings.forEach(([k,q,u])=>{
      if(isReady(k))return;if(isPantry(k)){pantry.add(k);return}
      const shelf=ING[k][2];const key=k+'|'+u;
      if(day>shelf){local[day]=local[day]||{};const L=local[day];L[key]=L[key]||{k,u,q:0};L[key].q+=q*f}
      else{hyper[key]=hyper[key]||{k,u,q:0};hyper[key].q+=q*f}
    });
  });
  const cost=[...Object.values(hyper),...Object.values(local).flatMap(Object.values)].reduce((s,x)=>s+x.q*unitCost(x.k,x.u),0);
  return {hyper,local,pantry:[...pantry],cost:Math.round(cost/50)*50};
}
function findShopItem(id){
  const sh=shopping(state.week);const parts=id.split('|');const loc=parts[0];const key=parts.slice(1).join('|');
  if(loc==='h')return sh.hyper[key];const day=Number(loc.slice(1));return sh.local[day]&&sh.local[day][key];
}
function prepPlan(ids){
  const placed=[];
  ids.forEach((id,n)=>{
    const tasks=D[id].prep||[[0,D[id].active,D[id].name,1]];let s=0;
    if(n>0){for(s=0;s<240;s++){if(tasks.every(t=>!t[3]||placed.every(p=>!p[3]||s+t[0]+t[1]<=p[0]||s+t[0]>=p[0]+p[1])))break}}
    tasks.forEach(t=>placed.push([s+t[0],t[1],t[2],t[3]]));
  });
  placed.sort((a,b)=>a[0]-b[0]||b[3]-a[3]);
  const total=Math.max(...placed.map(p=>p[0]+p[1]));const active=placed.filter(p=>p[3]).reduce((s,p)=>s+p[1],0);
  return {placed,total,active};
}
function hm(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}

/* ---------- готовка и запасы ---------- */
const YIELD={p_grain:[4,'порц.'],s_eggs:[10,'шт'],s_buzh:[800,'г'],s_muffins:[12,'шт']};
function tiny(u){return u==='г'||u==='мл'?15:.5}
function consume(d,p){
  const f=p/d.serves,t=today(),used=[];
  d.ings.forEach(([k,q,u])=>{
    if(isPantry(k))return;let need=q*f;
    const c=state.fridge.filter(i=>i.k===k&&isFresh(i,t)).sort((a,b)=>(a.z-b.z)||a.e.localeCompare(b.e));
    for(const it of c){
      if(need<=1e-9)break;
      if(it.q!=null&&it.u===u){const take=Math.min(it.q,need);it.q-=take;need-=take;if(it.q<tiny(u))it.gone=1;used.push(k)}
      else{const sec=ING[k]?ING[k][1]:'';if(sec==='meat'||sec==='ready'){it.gone=1;used.push(k)}need=0}
    }
  });
  state.fridge=state.fridge.filter(i=>!i.gone);
  return [...new Set(used)];
}
function addFridge(k,n,days,z,q,u){
  const t=today();const it={id:rid(),k,n,a:iso(t),e:iso(addDays(t,days)),z:!!z};
  if(q!=null&&u&&!isSpoon(u)){it.q=q;it.u=u}
  state.fridge.push(it);return it;
}
function markCooked(d,p){
  if(!p)p=portionsFor(d);
  const prev=JSON.stringify(state);const t=today();const eatNow=eatersOn(todayIdx());
  state.c[d.id]=(state.c[d.id]||0)+1;state.lc[d.id]=iso(t);
  const used=consume(d,p);const parts=[];
  if(used.length)parts.push('Списал: '+used.map(k=>ingName(k).toLowerCase()).join(', '));
  if(d.yields){
    const k=d.yields;const y=YIELD[d.id]||[Math.round((d.pcs||3*d.serves)*Math.max(0,p-eatNow)/d.serves),'шт'];
    if(y[0]>0){addFridge(k,ingName(k),ING[k][2],false,y[0],y[1]);parts.push('в запасах: '+ingName(k).toLowerCase())}
  }else if(d.kind==='batch'){
    const left=p-eatNow;
    if(left>0){const keep=Math.min(d.keep,2);addFridge('dish:'+d.id,d.name,keep-1,false,left,'порц.');parts.push('остатки до '+fDm.format(addDays(t,keep-1)))}
  }
  save();render();toast(parts.length?parts.join(' · '):'Записал',prev);
}

/* ---------- файлы: копия и календарь ---------- */
function downloadFile(file){
  const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return true;
}
async function shareFile(file){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true}catch(e){if(e&&e.name==='AbortError')return false;return downloadFile(file)}
  }
  return downloadFile(file);
}
async function exportBackup(){
  const data=JSON.stringify({app:'sytno',v:1,exported:new Date().toISOString(),state});
  const ok=await shareFile(new File([data],'sytno-'+iso(today())+'.json',{type:'application/json'}));
  if(ok){state.lastBackup=iso(today());save();render();toast('Копия готова. Сохрани файл в «Файлы» или отправь себе')}
}
function importFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{inp.value='';try{const o=JSON.parse(r.result);if(!o||o.app!=='sytno'||!o.state||!o.state.r)throw 0;ui.importData=o;ui.tab='dishes';render();
    const el=document.getElementById('importBox');if(el)el.scrollIntoView({block:'center'})}catch(e){toast('Этот файл не похож на копию «Сытно»')}};
  r.readAsText(f);
}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsFold(line){
  const enc=new TextEncoder();const out=[];let cur='',len=0;
  for(const ch of line){const b=enc.encode(ch).length;if(len+b>(out.length?74:75)){out.push(cur);cur='';len=0}cur+=ch;len+=b}
  out.push(cur);return out.join('\r\n ');
}
function icsDate(day,min){const x=new Date(day);x.setHours(0,0,0,0);x.setMinutes(min);const z=n=>String(n).padStart(2,'0');return x.getFullYear()+z(x.getMonth()+1)+z(x.getDate())+'T'+z(x.getHours())+z(x.getMinutes())+'00'}
function buildIcs(){
  const w=state.week,start=parse(w.start),sh=shopping(w),pp=prepPlan([w.slots[0].id,...w.extras]);
  const din=state.cal.dinner*60,prepAt=state.cal.prep*60,ev=[];
  const add=(day,at,dur,title,desc,alarm)=>ev.push({day,at,dur,title,desc,alarm});
  const list=o=>Object.values(o).map(x=>ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n');
  const lateNote=i=>w.late&&w.late[i]&&D[w.late[i]]?' Поздно вечером: '+D[w.late[i]].name.toLowerCase()+'.':'';
  if(Object.keys(sh.hyper).length)add(0,prepAt-90,60,'Купить в гипермаркете',list(sh.hyper),30);
  add(0,prepAt,pp.total,'Заготовка: '+D[w.slots[0].id].name,pp.placed.map(p=>hm(p[0])+' '+p[2]+(p[3]?'':' (само)')).join('\n'),30);
  w.slots.forEach((s,i)=>{
    const d=D[s.id];const steps=d.steps.map((x,n)=>(n+1)+'. '+stepText(d,n,portionsFor(d,i))).join('\n');
    if(s.role==='prep'||s.role==='left'){add(i,din,15,'Ужин: '+d.name+' — разогреть','Из заготовки, разогреть 3 минуты.'+lateNote(i),null);return}
    if(s.role==='batch'){
      add(i,din-d.total,d.total,'Запустить: '+d.name,'Порций: '+portionsFor(d,i)+'\n\n'+steps,10);
      add(i,din,15,'Ужин: '+d.name,'Запущено в '+hm(din-d.total)+', к ужину будет готово.'+lateNote(i),null);return}
    add(i,din-d.total,d.total,'Ужин: '+d.name,'Готовить '+d.total+' минут, белка '+d.prot+' грамм на порцию.'+lateNote(i)+'\n\nПорций: '+portionsFor(d,i)+'\n'+steps,10);
  });
  Object.keys(sh.local).forEach(day=>{day=Number(day);const s=w.slots[day];const d=D[s.id];
    const at=(s.role==='prep'||s.role==='left'?din:din-d.total)-60;add(day,at,15,'Купить по дороге домой',list(sh.local[day]),0)});
  const now=Date.now();const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sytno//Sytno doma//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Сытно дома'];
  let n=0;
  ev.forEach(e=>{
    const day=addDays(start,e.day);const end=new Date(day);end.setMinutes(e.at+Math.max(15,e.dur));if(end.getTime()<now)return;
    L.push('BEGIN:VEVENT','UID:sytno-'+w.start+'-'+(n++)+'@agulaliev.github.io','DTSTAMP:'+stamp,'DTSTART:'+icsDate(day,e.at),'DTEND:'+icsDate(day,e.at+Math.max(15,e.dur)),
      'SUMMARY:'+icsEsc(e.title),'DESCRIPTION:'+icsEsc(e.desc));
    if(e.alarm!=null)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:'+(e.alarm?'-PT'+e.alarm+'M':'PT0M'),'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return {text:L.map(icsFold).join('\r\n')+'\r\n',count:n};
}
function exportIcs(how){
  const r=buildIcs();if(!r.count)return toast('На этой неделе больше нечего напоминать');
  const file=new File([r.text],'sytno-nedelya.ics',{type:'text/calendar'});
  if(how==='share')shareFile(file);else downloadFile(file);
}

/* ---------- режим готовки ---------- */
let cook=null,wakeLock=null,actx=null,tick=null,lastBeep=0;
try{const c=JSON.parse(localStorage.getItem('sytno-cook')||'null');if(c&&D[c.id]&&Date.now()-c.started<6*3600e3)cook=c}catch(e){}
function saveCook(){try{cook?localStorage.setItem('sytno-cook',JSON.stringify(cook)):localStorage.removeItem('sytno-cook')}catch(e){}}
function stepTimers(text){
  const out=[];const re=/(\d+(?:,\d+)?)(?:\s*–\s*(\d+))?\s*(час(?:а|ов)?|минут[аы]?|мин)(?![а-яё])/g;let m;
  while((m=re.exec(text))){let v=parseFloat((m[2]||m[1]).replace(',','.'));if(m[3].startsWith('час'))v*=60;v=Math.round(v);if(v>=1&&v<=300&&!out.includes(v))out.push(v)}
  return out;
}
async function lockScreen(){
  try{if('wakeLock' in navigator&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');ui.wl=true}else ui.wl=false}
  catch(e){ui.wl=false}
  if(cook)renderCook();
}
function unlockScreen(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}
function audioUnlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!actx)return;try{const t0=actx.currentTime;
  [0,.3,.6].forEach(dt=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.25,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.22);
    o.connect(g);g.connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+.25)})}catch(e){}
}
function startCook(id,p){
  audioUnlock();
  const sheet=document.getElementById('sheet');if(sheet.open)sheet.close();
  cook={id,p,step:-1,timers:[],started:Date.now()};saveCook();renderCook();lockScreen();ensureTick();
}
function closeCook(){cook=null;saveCook();unlockScreen();const dlg=document.getElementById('cook');if(dlg.open)dlg.close()}
function renderCook(){
  const dlg=document.getElementById('cook');if(!cook){if(dlg.open)dlg.close();return}
  const d=D[cook.id];const n=d.steps.length;const s=cook.step;
  let body;
  if(s<0){const bn=bigNote(d,cook.p);body=`<h2>${d.name}</h2>${pplPicker(d,cook.p,'cook')}<p class="label" style="margin-top:16px">Сначала достань всё нужное</p>${ingList(d,cook.p)}${bn?`<p class="small note" style="margin-top:12px">${bn}</p>`:''}`}
  else{const st=stepText(d,s,cook.p);const tms=stepTimers(st);
    body=`<p class="cook-step">${st}</p>${helpBlocks(d,d.steps[s],false)}${tms.length?`<div class="chips" style="margin-top:20px">${tms.map(m=>`<button class="btn" data-act="tstart" data-m="${m}">Таймер на ${m>=60?hm(m)+' ч':m+' мин'}</button>`).join('')}</div>`:''}`}
  document.getElementById('cookIn').innerHTML=`
    <div class="cook-top"><div class="grow"><div class="kicker" style="margin:0">${s<0?'Подготовка':'Шаг '+(s+1)+' из '+n}</div><div class="small muted">${d.name} · ${portionNote(d,cook.p)}</div></div><button class="btn sm" data-act="cookclose">Закрыть</button></div>
    <div class="bar" style="margin:0"><i style="width:${(s+1)/n*100}%"></i></div>
    <div id="cookTimers" class="cook-timers"></div>
    <div class="cook-body">${body}</div>
    ${ui.wl===false?'<p class="small muted">Экран может погаснуть: телефон не разрешил держать его включённым.</p>':''}
    <div class="cook-nav"><button class="btn" data-act="cprev" ${s<0?'disabled':''}>Назад</button>${s<n-1?'<button class="btn primary" data-act="cnext">Дальше</button>':'<button class="btn primary" data-act="cdone">Готово</button>'}</div>`;
  buildTimers();
  if(!dlg.open)dlg.showModal();
}
function timerLeft(tm){const left=Math.max(0,Math.ceil((tm.end-Date.now())/1000));return Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
function buildTimers(){
  const box=document.getElementById('cookTimers');if(!box||!cook)return;
  box.innerHTML=cook.timers.map(tm=>tm.done
    ?`<button class="timer ring" data-act="tack" data-id="${tm.id}">${esc(tm.label)}: готово. Нажми, чтобы выключить</button>`
    :`<div class="timer"><b data-tleft="${tm.id}">${timerLeft(tm)}</b><span>${esc(tm.label)}</span><button class="tx" data-act="tdel" data-id="${tm.id}" aria-label="Отменить таймер">×</button></div>`).join('')
    +(cook.timers.some(t=>!t.done)?'<p class="small muted" style="margin:0">Звонит, пока приложение открыто. Звук не слышен в беззвучном режиме.</p>':'');
}
function ensureTick(){
  if(tick)return;
  tick=setInterval(()=>{
    if(!cook){clearInterval(tick);tick=null;return}
    let changed=false,ring=false;
    cook.timers.forEach(tm=>{if(!tm.done&&Date.now()>=tm.end){tm.done=true;changed=true}if(tm.done)ring=true});
    if(changed){saveCook();buildTimers()}
    else cook.timers.forEach(tm=>{const el=document.querySelector('[data-tleft="'+tm.id+'"]');if(el)el.textContent=timerLeft(tm)});
    if(ring&&Date.now()-lastBeep>1800){beep();lastBeep=Date.now()}
  },500);
}

function metaRow(d){

const HALF=new Set(['onion','carrot','tomatoes','bell_pepper','zucchini','eggplant','cucumbers','beet','potato','greens','canned_tomatoes','tushenka']);
function rq(v,u){return v>=1000?num(Math.round(v/100)/10)+(u==='г'?' кг':' л'):Math.max(10,Math.round(v/10)*10)+' '+u}
function recipeQty(k,q,u){
  if(u==='г'||u==='мл')return rq(q,u);

  if(u==='г'||u==='мл'||!HALF.has(k))return fmtQty(u==='г'||u==='мл'?q:Math.max(1,Math.round(q)),u);

}
function ingList(d,portions){

}
function plural(n,a,b,c){const m=n%100,l=n%10;return m>10&&m<20?c:l===1?a:l>=2&&l<=4?b:c}

  return t.replace(/\{([\d.,]+)([hc]?)(?:\|([^|}]+)\|([^|}]+)\|([^}]+))?\}(\s*(?:ч\.л\.|ст\.л\.|мл|л|г)(?![а-яё]))?/g,(m,n,h,a,b,c,u)=>{
    let v=parseFloat(n.replace(',','.'))*k;u=u||'';const unit=u.trim();
    if(h==='c')v=Math.min(5,Math.max(1.5,Math.round(v*2)/2));
    if(a){if(h&&v<1.75){v=Math.max(.5,Math.round(v*2)/2);if(v%1)return frac(v)+' '+b}v=Math.max(1,Math.round(v));return v+' '+plural(v,a,b,c)}
    if(unit==='ч.л.'||unit==='ст.л.')return frac(Math.max(.25,Math.round(v*4)/4))+u;
    if(unit==='мл'||unit==='г')return rq(v,unit);
    if(unit==='л'){if(v<1)return Math.max(300,Math.round(v*1000/50)*50)+' мл';return num(Math.round(v*10)/10)+u}

}
function stepK(d,p){return d.fixed||!p?1:p/d.serves}

  if(d.tool==='плита'&&k>=1.4)return 'Продуктов много: бери самую большую сковороду или готовь в 2 захода. Мясо, если выложить всё сразу, потушится, а не обжарится.';

function nowPool(){
  if(ui.mode==='10')return DISHES.filter(d=>(d.kind==='build'||d.kind==='snack'&&!d.fixed)&&d.total<=10);
  if(ui.mode==='20')return DISHES.filter(d=>d.kind==='quick'&&d.total<=30);
  return DISHES.filter(d=>(d.kind==='batch'||d.kind==='quick'||d.id==='s_syrniki')&&d.total-d.active>=15);
}
function pickNow(){
  const pool=nowPool();
  const scored=pool.map(d=>{let w=weight(d);const cv=coverage(d);
    if(d.kind==='build'||d.id==='s_plate'){const rd=d.ings.filter(i=>isReady(i[0]));w*=rd.every(i=>hasKey(i[0]))?5:.25}
    if(ui.fromFridge)w*=.05+cv.ratio*cv.ratio*4;return [d,w]}).filter(x=>x[1]>0&&x[0].id!==ui.nowId);
  if(!scored.length)return pool.find(d=>weight(d)>0)||null;
  let t=scored.reduce((s,x)=>s+x[1],0)*Math.random();for(const [d,w] of scored){if((t-=w)<=0)return d}return scored[0][0];
}

  const w=state.week;const sh=shopping(w);const start=parse(w.start);
  let s='Гипермаркет:\n'+Object.values(sh.hyper).map(x=>'— '+ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n');
  Object.keys(sh.local).map(Number).sort((a,b)=>a-b).forEach(dd=>{s+='\n\nУ дома, '+fWd.format(addDays(start,dd))+' '+fDm.format(addDays(start,dd))+':\n'+Object.values(sh.local[dd]).map(x=>'— '+ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n')});
  if(sh.pantry.length)s+='\n\nПроверить дома: '+sh.pantry.map(ingName).join(', ');
  return s;
}
function rFridge(){
  const t=today();
  const items=[...state.fridge].sort((a,b)=>(a.z-b.z)||a.e.localeCompare(b.e));
  let h='<div class="stack"><h2>Холодильник</h2>';
  if(!items.length)h+='<div class="card empty"><p class="muted">Пока пусто. Отметь купленное в «Покупках» или добавь ниже — здесь появятся сроки и идеи, что из этого сделать.</p></div>';
  else{h+='<div class="card" style="padding-block:4px"><div class="list">'+items.map(i=>{
    const dl=diffDays(parse(i.e),t);let b;
    if(i.z)b='<span class="badge">морозилка</span>';else if(dl<0)b='<span class="badge b-danger">просрочено</span>';else if(dl===0)b='<span class="badge b-warn">сегодня</span>';else if(dl===1)b='<span class="badge b-warn">до завтра</span>';else b=`<span class="badge b-new">ещё ${dl} дн.</span>`;
    return `<div class="item" style="flex-wrap:wrap;gap:8px 10px"><div class="grow" style="flex-basis:100%"><div style="font-weight:500">${esc(i.n)}</div><div class="small muted">с ${fDm.format(parse(i.a))}${i.q!=null?' · '+fmtQty(i.q,i.u):''}</div></div>${b}<span style="flex:1"></span><button class="btn sm ghost" data-act="${i.z?'thaw':'freeze'}" data-id="${i.id}">${i.z?'Разморозить':'В морозилку'}</button><button class="btn sm" data-act="fdel" data-id="${i.id}" aria-label="Убрать">Убрать</button></div>`}).join('')+'</div></div>';
    const ranked=DISHES.filter(d=>d.kind!=='base'&&weight(d)>0).map(d=>[d,coverage(d)]).filter(x=>x[1].have.length>0).sort((a,b)=>b[1].ratio-a[1].ratio||b[1].have.length-a[1].have.length).slice(0,6);
    if(ranked.length)h+=`<div class="card"><h3>Что приготовить из этого</h3><div class="list" style="margin-top:6px">${ranked.map(([d,cv])=>`<div class="item"><div class="grow"><button class="linkish" data-act="open" data-id="${d.id}">${d.name}</button><div class="small muted">${cv.miss.length?'докупить: '+cv.miss.map(i=>ingName(i[0]).toLowerCase()).join(', '):'всё есть'}</div></div><span class="badge ${cv.ratio===1?'b-new':''}">${cv.have.length} из ${cv.need.length}</span></div>`).join('')}</div></div>`;
  }
  h+=`<div class="card"><div class="label">Добавить</div><div class="seg" style="margin-top:10px"><button data-act="place" data-v="fridge" aria-pressed="${ui.place==='fridge'}">В холодильник</button><button data-act="place" data-v="freezer" aria-pressed="${ui.place==='freezer'}">В морозилку</button></div>
    <div class="chips" style="margin-top:12px">${FRIDGE_PRESETS.map(k=>`<button class="chip" data-act="fadd" data-k="${k}">${ingName(k)}</button>`).join('')}</div>
    <form class="addrow" id="faddForm" style="margin-top:12px"><input id="fname" placeholder="Что-то своё, например «гуляш от мамы»" autocomplete="off"><button class="btn" type="submit">Добавить</button></form>
    <p class="small muted" style="margin-top:8px">Срок ставится сам: сырой фарш 1 день, курица 2, готовое 2, морозилка 3 месяца.</p></div>`;
  h+='</div>';return h;
}
function rDishes(){
  const rateable=DISHES.filter(d=>d.kind!=='base');
  const unrated=rateable.filter(d=>state.r[d.id]===undefined);
  const cur=unrated[0];
  let h='<div class="stack"><h2>Блюда</h2>';
  h+=`<div class="card"><div class="label">Знакомство</div>`;
  if(cur){h+=`<p class="small muted" style="margin-top:4px">Не помнишь, что не любишь? Пройдись по списку: так генератор быстрее поймёт вкус.</p>
    <div style="margin-top:14px"><div class="kicker">${KIND[cur.kind]}</div><h3 style="font-size:18px">${cur.name}</h3><p class="desc small">${cur.desc}</p></div>
    <div class="actions"><button class="btn" data-act="deck" data-id="${cur.id}" data-v="-1">Не моё</button><button class="btn" data-act="deck" data-id="${cur.id}" data-v="0">Не знаю</button><button class="btn primary" data-act="deck" data-id="${cur.id}" data-v="1" style="margin-left:auto">Хочу</button></div>`}
  else h+=`<p style="margin-top:6px">Все блюда оценены. Оценки можно поменять в списке ниже.</p>`;
  h+=`<div class="bar"><i style="width:${(rateable.length-unrated.length)/rateable.length*100}%"></i></div><p class="small muted" style="margin-top:6px">оценено ${rateable.length-unrated.length} из ${rateable.length}</p></div>`;
  h+=`<div class="card"><div class="label">Не ем</div><p class="small muted" style="margin-top:4px">Блюда с отмеченными продуктами пропадут из подбора.</p><div class="chips" style="margin-top:10px">${BANNABLE.map(k=>`<button class="chip ban" data-act="ban" data-k="${k}" aria-pressed="${state.ban.includes(k)}">${ingName(k)}</button>`).join('')}</div></div>`;
  const F={all:'Все',batch:'Заготовка',quick:'Быстро',build:'Из заготовки',snack:'Перекусы'};
  h+=`<div class="seg">${Object.entries(F).map(([k,v])=>`<button data-act="filter" data-v="${k}" aria-pressed="${ui.filter===k}">${v}</button>`).join('')}</div>`;
  const list=rateable.filter(d=>ui.filter==='all'||d.kind===ui.filter);
  h+=`<div class="card" style="padding-block:4px"><div class="list">${list.map(d=>`<div class="item" style="flex-wrap:wrap"><div class="grow" style="min-width:180px"><button class="linkish" data-act="open" data-id="${d.id}">${d.name}</button><div class="small muted">${KIND[d.kind]} · ${d.total} мин · ${d.prot} г белка${state.c[d.id]?' · готовил '+state.c[d.id]+' р.':''}${isBanned(d)?' · <span style="color:var(--danger)">есть «не ем»</span>':''}</div></div><div style="display:flex;gap:6px">${rateBtns(d)}</div></div>`).join('')}</div></div>`;
  h+=`<div class="card tip"><h3>Что докупить на 10 тысяч</h3><ol>
    <li><b>Аэрогриль на 5–6 литров</b>, примерно 6–9 тыс. ₽. Курица, котлеты и картошка дольками за 20–25 минут без масла: положил, закрыл, ушёл. Заменяет духовку для 1–2 порций.</li>
    <li><b>Стеклянные контейнеры с крышками</b>, 6–8 штук, около 1,5 тыс. ₽. Заготовку видно, греется прямо в них.</li>
    <li><b>Термометр-щуп</b>, около 700 ₽. Курица готова при 74°, фарш при 71°. Не надо резать и гадать.</li></ol></div>`;
  h+=`<div class="card" id="importBox"><div class="label">Резервная копия</div>
    <p class="small muted" style="margin-top:4px">Оценки, запасы и меню хранятся только на этом телефоне. Копия — один файл: сохрани его в «Файлы» или отправь себе в Telegram. ${state.lastBackup?'Последняя копия: '+fDm.format(parse(state.lastBackup))+'.':'Копий пока не было.'}</p>`;
  if(ui.importData){const o=ui.importData.state;h+=`<div class="note" style="margin-top:12px">Копия от ${esc(new Date(ui.importData.exported).toLocaleDateString('ru-RU'))}: оценок ${Object.keys(o.r||{}).length}, в запасах ${(o.fridge||[]).length}. Текущие данные заменятся.<div class="actions" style="margin-top:10px"><button class="btn" data-act="impno">Отмена</button><button class="btn primary" data-act="impok">Восстановить</button></div></div>`}
  else h+=`<div class="actions" style="margin-top:12px"><button class="btn primary" data-act="backup">Сохранить копию</button><button class="btn" data-act="restore">Восстановить из файла</button></div>`;
  h+='</div>';
  h+=`<div class="card"><div class="dline" style="align-items:center"><span class="small muted">Сбросить оценки, холодильник и меню</span><button class="btn sm" data-act="reset" style="${ui.resetArm?'color:var(--danger);border-color:var(--danger)':''}">${ui.resetArm?'Точно сбросить?':'Сбросить'}</button></div></div>`;
  h+='</div>';return h;
}
function openSheet(d,day){
  const p=curP(d,day);ui.sheet={id:d.id,day};
  document.getElementById('sheetIn').innerHTML=`<button class="btn sm sheet-x" data-act="close" aria-label="Закрыть">Закрыть</button><div class="kicker">${KIND[d.kind]} · ${d.cui}</div><h2>${d.name}</h2><p class="desc">${d.desc}</p>${metaRow(d)}
    ${pplPicker(d,p,'sheet')}<details open><summary>Продукты ${portionNote(d,p)}</summary>${ingList(d,p)}</details>${stepsList(d,p)}${cookActions(d,p,false)}`;
  const dlg=document.getElementById('sheet');if(!dlg.open)dlg.showModal();
}
let toastT;
function toast(m,prev){
  const el=document.getElementById('toast');ui.undo=prev||null;
  el.innerHTML='<span>'+esc(m)+'</span>'+(prev?'<button class="toast-undo" data-act="undo">Вернуть</button>':'');
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;ui.undo=null},prev?6000:2600);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const id=b.dataset.id;
  if(a!=='reset')ui.resetArm=false;
  const sheet=document.getElementById('sheet');const inSheet=sheet.contains(b);
  const dayOf=()=>b.dataset.day!==undefined?Number(b.dataset.day):undefined;
  switch(a){
    case 'tab':ui.tab=b.dataset.tab;saveUi();render();window.scrollTo(0,0);break;
    case 'mode':ui.mode=b.dataset.v;ui.nowId=null;saveUi();render();break;
    case 'ff':ui.fromFridge=!ui.fromFridge;ui.nowId=null;render();break;
    case 'next':ui.nowId=(pickNow()||{}).id;render();break;
    case 'rate':{const v=Number(b.dataset.v);if(state.r[id]===v)delete state.r[id];else state.r[id]=v;save();render();if(inSheet)openSheet(D[id],ui.sheet&&ui.sheet.day);
      if(v===-1&&state.r[id]===-1&&!inSheet&&ui.tab==='now'){ui.nowId=(pickNow()||{}).id;render()}break}
    case 'deck':{state.r[id]=Number(b.dataset.v);save();render();break}
    case 'cook':if(inSheet)sheet.close();markCooked(D[id],Number(b.dataset.p)||undefined);break;
    case 'cookmode':startCook(id,Number(b.dataset.p)||portionsFor(D[id]));break;
    case 'cookresume':renderCook();lockScreen();ensureTick();break;
    case 'cookclose':closeCook();render();break;
    case 'cnext':cook.step=Math.min(cook.step+1,D[cook.id].steps.length-1);saveCook();renderCook();break;
    case 'cprev':cook.step=Math.max(cook.step-1,-1);saveCook();renderCook();break;
    case 'cdone':{const c=cook;closeCook();markCooked(D[c.id],c.p);break}
    case 'tstart':{audioUnlock();const m=Number(b.dataset.m);cook.timers.push({id:rid(),label:'Шаг '+(cook.step+1)+' · '+(m>=60?hm(m)+' ч':m+' мин'),end:Date.now()+m*60000,done:false});saveCook();buildTimers();ensureTick();break}
    case 'tdel':case 'tack':cook.timers=cook.timers.filter(t=>t.id!==id);saveCook();buildTimers();break;
    case 'open':openSheet(D[id],dayOf());break;
    case 'ppl':{const n=Number(b.dataset.v),ctx=b.dataset.ctx;ui.ppl[id]=n;
      if(ctx==='cook'&&cook){cook.p=n*pplMult(D[id]);saveCook();renderCook()}
      else if(ctx==='sheet'){openSheet(D[id],ui.sheet&&ui.sheet.day);render()}
      else render();break}
    case 'close':sheet.close();break;
    case 'regen':state.week=genWeek();save();render();toast('Новое меню собрано');break;
    case 'swap':replaceSlot(Number(b.dataset.i));break;
    case 'thrift':state.thrift=b.dataset.v==='1';state.week=genWeek();save();render();toast(state.thrift?'Меню пересобрано: сытно и дёшево':'Меню пересобрано без учёта цены');break;
    case 'eaters':{const n=Number(b.dataset.v);state.eaters=n;state.week.slots.forEach(s=>s.e=n);save();render();break}
    case 'deat':{const s=state.week.slots[Number(b.dataset.i)];s.e=s.e%3+1;save();render();break}
    case 'ics':exportIcs('download');break;
    case 'icsshare':exportIcs('share');break;
    case 'copy':{const txt=shopText();const done=()=>toast('Список скопирован');
      const fallback=()=>{const box=document.getElementById('copybox');box.innerHTML='<textarea class="copy" readonly></textarea>';const ta=box.firstChild;ta.value=txt;ta.focus();ta.select();toast('Выделил текст, скопируй вручную')};
      try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}break}
    case 'place':ui.place=b.dataset.v;render();break;
    case 'fadd':{const k=b.dataset.k;const z=ui.place==='freezer';addFridge(k,ingName(k),z?90:ING[k][2],z);save();render();toast('Добавил: '+ingName(k).toLowerCase());break}
    case 'fdel':state.fridge=state.fridge.filter(i=>i.id!==id);save();render();break;
    case 'freeze':{const i=state.fridge.find(x=>x.id===id);if(i){i.z=true;i.e=iso(addDays(today(),90))}save();render();break}
    case 'thaw':{const i=state.fridge.find(x=>x.id===id);if(i){i.z=false;i.e=iso(addDays(today(),1))}save();render();toast('Разморозь в холодильнике, срок — до завтра');break}
    case 'ban':{const k=b.dataset.k;state.ban=state.ban.includes(k)?state.ban.filter(x=>x!==k):[...state.ban,k];save();render();break}
    case 'filter':ui.filter=b.dataset.v;render();break;
    case 'undo':if(ui.undo){state=normalize(JSON.parse(ui.undo));ui.undo=null;save();render();document.getElementById('toast').hidden=true}break;
    case 'backup':exportBackup();break;
    case 'restore':document.getElementById('importFile').click();break;
    case 'impok':state=normalize(ui.importData.state);ui.importData=null;save();render();toast('Данные восстановлены');break;
    case 'impno':ui.importData=null;render();break;
    case 'reset':if(!ui.resetArm){ui.resetArm=true;render()}else{const keep=state.lastBackup;state=blank();state.lastBackup=keep;state.week=genWeek();ui.resetArm=false;save();render();toast('Всё сброшено')}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'){importFile(t);return}
  if(t.matches('select[data-cal]')){state.cal[t.dataset.cal]=Number(t.value);save();return}
  if(t.matches('input[data-price]')){const k=t.dataset.price,v=Number(String(t.value).replace(',','.'));
    if(v>0&&v!==PRICE[k][0])state.prices[k]=v;else delete state.prices[k];t.value=priceOf(k);save();
    const el=document.getElementById('shopTotal');if(el)el.textContent=shopping(state.week).cost.toLocaleString('ru-RU');return}
  if(!t.matches('[data-act="buy"]'))return;
  const w=state.week;const id=t.dataset.id;
  if(t.checked){const x=findShopItem(id);let rec=true;
    if(x){const t0=today();const same=state.fridge.find(i=>i.k===x.k&&!i.z&&isFresh(i,t0));
      if(same&&isSpoon(x.u))rec={f:same.id,q:0};
      else if(same&&same.q!=null&&same.u===x.u){same.q+=x.q;same.e=iso(addDays(t0,ING[x.k][2]));rec={f:same.id,q:x.q}}
      else if(same&&same.q==null&&!isSpoon(x.u)){same.q=x.q;same.u=x.u;same.e=iso(addDays(t0,ING[x.k][2]));rec={f:same.id,q:0}}
      else rec={f:addFridge(x.k,ingName(x.k),ING[x.k][2],false,x.q,x.u).id,q:x.q,n:1}}
    w.bought[id]=rec}
  else{const rec=w.bought[id];
    if(typeof rec==='string')state.fridge=state.fridge.filter(i=>i.id!==rec);
    else if(rec&&rec.f){const it=state.fridge.find(i=>i.id===rec.f);
      if(it){if(rec.q&&it.q!=null){it.q-=rec.q;if(it.q<tiny(it.u))state.fridge=state.fridge.filter(i=>i.id!==rec.f)}else if(rec.n)state.fridge=state.fridge.filter(i=>i.id!==rec.f)}}
    delete w.bought[id]}
  save();render();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='faddForm')return;e.preventDefault();
  const v=document.getElementById('fname').value.trim();if(!v)return;
  const z=ui.place==='freezer';addFridge(null,v.slice(0,60),z?90:2,z);save();render();toast('Добавил: '+v.slice(0,40));
});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.close()});
document.getElementById('cook').addEventListener('cancel',e=>{e.preventDefault()});

render();
if(cook){renderCook();lockScreen();ensureTick()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>
