<style>
/* Layout: одна колонка как приложение на телефоне, max 560px, нижняя панель вкладок; карточка блюда — главный объект */
:root{
  --bg:#ECEFE9; --surface:#FAFBF8; --surface-2:#E1E6DD; --ink:#1A201C; --muted:#5A655D; --line:#CBD3C8;
  --accent:#A3223A; --accent-ink:#FFF5F3; --accent-soft:#F3DCE0;
  --herb:#2E6842; --herb-soft:#D9EADD; --warn:#9A5600; --warn-soft:#F6E4C8; --danger:#B4232F; --danger-soft:#F7D9DB;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#191F1B; --surface-2:#232B25; --ink:#E6EBE4; --muted:#98A59B; --line:#2E3832;
  --accent:#E25A6F; --accent-ink:#1C0D10; --accent-soft:#3B1D24;
  --herb:#7CBB8D; --herb-soft:#1D3325; --warn:#E5A24C; --warn-soft:#382916; --danger:#F07A80; --danger-soft:#3D1C1F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#191F1B; --surface-2:#232B25; --ink:#E6EBE4; --muted:#98A59B; --line:#2E3832;
  --accent:#E25A6F; --accent-ink:#1C0D10; --accent-soft:#3B1D24;
  --herb:#7CBB8D; --herb-soft:#1D3325; --warn:#E5A24C; --warn-soft:#382916; --danger:#F07A80; --danger-soft:#3D1C1F;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-0.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);text-align:right}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.hero{padding:18px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.desc{color:var(--muted);margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.meta .prot{background:var(--herb-soft);color:var(--herb);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{font-size:14px;font-weight:500;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ban[aria-pressed="true"]{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:14px;font-weight:500;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[aria-pressed="true"].like{background:var(--herb-soft);color:var(--herb);border-color:var(--herb)}
.btn[aria-pressed="true"].dis{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .primary{margin-left:auto}
details{margin-top:14px}
summary{font-weight:600;cursor:pointer}
.ings{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ings li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.ings li.have span:first-child::after{content:" · есть";color:var(--herb);font-size:13px}
.steps{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.b-new{background:var(--herb-soft);color:var(--herb)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.note{padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink)}
.note b{color:var(--warn)}
.plan{background:var(--herb-soft);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan b{color:var(--herb)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.linkish{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:600;text-align:left}
.linkish:hover{color:var(--accent)}
.day{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dt{font-variant-numeric:tabular-nums;text-align:center;padding-top:2px}
.day .dt b{display:block;font-family:var(--display);font-size:20px;line-height:1}
.day .dt span{font-size:12px;color:var(--muted)}
.day.today .dt b{color:var(--accent)}
.day .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.dline{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sub{font-size:13px;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}
.tl{display:grid;grid-template-columns:46px 1fr;gap:6px 10px;margin-top:10px;font-size:14px}
.tl .t{font-variant-numeric:tabular-nums;color:var(--muted)}
.tl .pass{color:var(--muted);font-style:italic}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.shop li:last-child{border-bottom:0}
.shop label{flex:1;min-width:0;display:flex;gap:10px;align-items:center;cursor:pointer}
.shop input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.shop .q{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.shop li.done .nm{text-decoration:line-through;color:var(--muted)}
.sec{margin-top:12px}
.sec:first-child{margin-top:0}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--herb)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{text-align:center;padding:28px 12px}
.empty p{margin-bottom:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .inner{display:flex;max-width:560px;margin:0 auto;gap:2px}
nav.tabs button{flex:1;min-width:0;font-size:12px;font-weight:600;padding:11px 2px;border:0;background:none;color:var(--muted);border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
dialog#sheet{border:0;padding:0;width:calc(100% - 24px);max-width:560px;border-radius:20px;background:var(--surface);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(8,12,9,.55)}
.sheet-in{padding:18px;max-height:82vh;overflow:auto}
.sheet-x{float:right;margin:-4px -4px 0 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.tip ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
textarea.copy{width:100%;min-height:160px;font:13px/1.5 var(--body);border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}
</style>

</head>

/* ---------- даты ---------- */
const DAY=864e5;
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(a,b){return Math.round((parse(iso(a))-parse(iso(b)))/DAY)}
const fWd=new Intl.DateTimeFormat('ru-RU',{weekday:'short'});
const fDm=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
const fFull=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'});

function normalize(s){const b=blank();return Object.assign(b,s||{})}

try{const raw=localStorage.getItem(LS);if(raw)state=normalize(JSON.parse(raw))}catch(e){}

try{const u=JSON.parse(localStorage.getItem('sytno-ui')||'{}');if(u.tab)ui.tab=u.tab;if(u.mode)ui.mode=u.mode}catch(e){}
function saveUi(){try{localStorage.setItem('sytno-ui',JSON.stringify({tab:ui.tab,mode:ui.mode}))}catch(e){}}

/* ---------- утилиты ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return String(v).replace('.',',')}
function fmtQty(q,u){
  if(u==='г'||u==='мл'){let v=q<100?Math.round(q/10)*10:Math.round(q/50)*50;if(!v)v=10;
    if(v>=1000)return num(Math.round(v/100)/10)+(u==='г'?' кг':' л');return v+' '+u}
  const n=Math.max(1,Math.ceil(q-1e-9));
  const F={'пучок':['пучок','пучка','пучков'],'банка':['банка','банки','банок'],'головка':['головка','головки','головок']}[u];
  if(F){const m10=n%10,m100=n%100;u=m10===1&&m100!==11?F[0]:m10>=2&&m10<=4&&(m100<12||m100>14)?F[1]:F[2]}
  return n+' '+u;
}
function shopQty(q,u){return u==='ст.л.'||u==='ч.л.'?'1 уп. · нужно '+fmtQty(q,u):fmtQty(q,u)}
function ingName(k){return ING[k]?ING[k][0]:k}
function isPantry(k){return ING[k]&&ING[k][3]===1}
function isReady(k){return ING[k]&&ING[k][1]==='ready'}
function mainProtein(d){const m=d.ings.find(i=>ING[i[0]]&&ING[i[0]][1]==='meat');if(!m)return 'eggs';const k=m[0];return k.startsWith('chicken')?'chicken':k.startsWith('turkey')?'turkey':k==='mince'?'beef':k}
function defaultPortions(d){if(d.fixed)return d.serves;if(d.kind==='batch')return state.eaters*2;if(d.kind==='snack')return d.serves;return state.eaters}
function isBanned(d){return d.ings.some(i=>state.ban.includes(i[0]))}
function isNew(d){return state.r[d.id]===undefined&&!state.c[d.id]}
function weight(d){
  if(isBanned(d)||state.r[d.id]===-1)return 0;
  let w=state.r[d.id]===1?4:isNew(d)?1.6:1;
  const lc=state.lc[d.id];if(lc&&diffDays(today(),parse(lc))<6)w*=.3;
  return w;
}
function pick(list,exclude){
  const c=list.filter(d=>!(exclude||[]).includes(d.id)).map(d=>[d,weight(d)]).filter(x=>x[1]>0);
  if(!c.length)return null;let t=c.reduce((s,x)=>s+x[1],0)*Math.random();
  for(const [d,w] of c){if((t-=w)<=0)return d}return c[c.length-1][0];
}
function freshFridge(){const t=today();return state.fridge.filter(i=>i.z||diffDays(parse(i.e),t)>=0)}
function hasKey(k){return freshFridge().some(i=>i.k===k)}
function coverage(d){const need=d.ings.filter(i=>!isPantry(i[0]));const have=need.filter(i=>hasKey(i[0]));return {need,have,miss:need.filter(i=>!hasKey(i[0])),ratio:need.length?have.length/need.length:1}}

/* ---------- неделя ---------- */
function genWeek(){
  const batch=DISHES.filter(d=>d.kind==='batch'),quick=DISHES.filter(d=>d.kind==='quick');
  const A=pick(batch)||batch[0];
  const B=pick(batch.filter(d=>mainProtein(d)!==mainProtein(A)),[A.id])||pick(batch,[A.id])||batch[1];
  let Q1=pick(quick.filter(isNew))||pick(quick);
  const Q2=pick(quick.filter(d=>mainProtein(d)!==mainProtein(Q1)),[Q1.id])||pick(quick,[Q1.id]);
  const Q3=pick(quick,[Q1.id,Q2&&Q2.id])||Q1;
  const extras=['p_grain','s_eggs'];
  if(A.tool!=='духовка')extras.push(Math.random()<.65?'s_buzh':'s_muffins');
  const w={start:iso(today()),slots:[
    {role:'prep',id:A.id},{role:'left',id:A.id},{role:'batch',id:B.id},{role:'left',id:B.id},
    {role:'quick',id:Q1.id},{role:'quick',id:Q2.id},{role:'spare',id:Q3.id}],extras,late:[],bought:{}};
  w.late=genLate(w);
  return w;
}
function readyOn(w,day){
  const out=[];
  w.extras.forEach(id=>{const d=D[id];if(d.yields&&day<=d.keep)out.push(d.yields)});
  return out;
}
function genLate(w){
  const pool=['s_tvorog','s_syrniki','s_plate','b_rice_egg','b_cheese_bowl','b_omelet','b_grechka_egg','chirbuli'];
  const res=[];let prev=null;
  for(let day=0;day<7;day++){
    const ready=readyOn(w,day);
    let cands=pool.map(id=>D[id]).filter(d=>d.ings.every(i=>!isReady(i[0])||ready.includes(i[0])));
    if(w.extras.includes('s_muffins')&&day<=2)cands.push(D.s_muffins);
    const p=pick(cands,prev?[prev]:[])||pick(cands)||D.s_tvorog;res.push(p.id);prev=p.id;
  }
  return res;
}
function replaceSlot(i){
  const w=state.week;const s=w.slots[i];
  if(s.role==='prep'||s.role==='left'&&i===1||s.role==='batch'||s.role==='left'&&i===3){
    const a=(i<=1)?0:2;const other=(a===0)?w.slots[2].id:w.slots[0].id;
    const nd=pick(DISHES.filter(d=>d.kind==='batch'),[w.slots[a].id,other]);if(!nd)return toast('Больше нечего предложить: сними пару дизлайков');
    w.slots[a].id=nd.id;w.slots[a+1].id=nd.id;
    if(a===0){w.extras=w.extras.filter(x=>x!=='s_buzh'&&x!=='s_muffins');if(nd.tool!=='духовка')w.extras.push('s_buzh');w.late=genLate(w)}
  }else{
    const nd=pick(DISHES.filter(d=>d.kind==='quick'),w.slots.map(x=>x.id));if(!nd)return toast('Больше нечего предложить');
    s.id=nd.id;
  }
  save();render();
}
function weekItems(w){
  const it=[];const e=state.eaters;
  w.slots.forEach((s,day)=>{if(s.role==='left')return;const d=D[s.id];it.push({d,portions:d.kind==='batch'?e*2:e,day})});
  w.extras.forEach(id=>it.push({d:D[id],portions:D[id].serves,day:0}));
  w.late.forEach((id,day)=>{const d=D[id];if(id==='s_muffins')return;it.push({d,portions:1,day,late:1})});
  return it;
}
function shopping(w){
  const hyper={},local={},pantry=new Set();let cost=0;
  weekItems(w).forEach(({d,portions,day})=>{
    const f=portions/d.serves;cost+=d.cost*portions;
    d.ings.forEach(([k,q,u])=>{
      if(isReady(k))return;if(isPantry(k)){pantry.add(k);return}
      const shelf=ING[k][2];const key=k+'|'+u;
      if(day>shelf){local[day]=local[day]||{};const L=local[day];L[key]=L[key]||{k,u,q:0};L[key].q+=q*f}
      else{hyper[key]=hyper[key]||{k,u,q:0};hyper[key].q+=q*f}
    });
  });
  return {hyper,local,pantry:[...pantry],cost:Math.round(cost/50)*50};
}
function prepPlan(ids){
  const placed=[];
  ids.forEach((id,n)=>{
    const tasks=D[id].prep||[[0,D[id].active,D[id].name,1]];let s=0;
    if(n>0){for(s=0;s<240;s++){if(tasks.every(t=>!t[3]||placed.every(p=>!p[3]||s+t[0]+t[1]<=p[0]||s+t[0]>=p[0]+p[1])))break}}
    tasks.forEach(t=>placed.push([s+t[0],t[1],t[2],t[3]]));
  });
  placed.sort((a,b)=>a[0]-b[0]||b[3]-a[3]);
  const total=Math.max(...placed.map(p=>p[0]+p[1]));const active=placed.filter(p=>p[3]).reduce((s,p)=>s+p[1],0);
  return {placed,total,active};
}
function hm(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}

/* ---------- готовка ---------- */
function markCooked(d){
  state.c[d.id]=(state.c[d.id]||0)+1;state.lc[d.id]=iso(today());
  const t=today();let msg='Записал. Блюдо реже будет повторяться ближайшие дни';
  if(d.yields){const k=d.yields;state.fridge.push({id:rid(),k,n:ingName(k),a:iso(t),e:iso(addDays(t,ING[k][2])),z:false});msg='Добавил в холодильник: '+ingName(k).toLowerCase()}
  else if(d.kind==='batch'){const keep=Math.min(d.keep,2);state.fridge.push({id:rid(),k:'dish:'+d.id,n:d.name,a:iso(t),e:iso(addDays(t,keep-1)),z:false});msg='Остатки в холодильнике, доесть до '+fDm.format(addDays(t,keep-1))}
  save();render();toast(msg);
}
function rid(){return Math.random().toString(36).slice(2,9)}

/* ---------- отрисовка ---------- */
const view=document.getElementById('view');
function render(){
  document.getElementById('sync').textContent=fFull.format(today());
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'true':'false'));
  if(!state.week){state.week=genWeek();save()}
  view.innerHTML=({now:rNow,week:rWeek,shop:rShop,fridge:rFridge,dishes:rDishes}[ui.tab]||rNow)();
}
function metaRow(d,portions){
  return `<div class="meta"><span>${d.active} мин работы</span>${d.total>d.active?`<span>${d.total} мин всего</span>`:''}<span class="prot">${d.prot} г белка</span><span>≈ ${d.cost} ₽ за порцию</span><span>${d.tool}</span></div>`;
}
function ingList(d,portions){
  const f=portions/d.serves;
  return `<ul class="ings">${d.ings.map(([k,q,u])=>`<li class="${!isPantry(k)&&hasKey(k)?'have':''}"><span>${ingName(k)}</span><span>${isPantry(k)&&u==='ч.л.'?q+' '+u:fmtQty(q*f,u)}</span></li>`).join('')}</ul>`;
}
function stepsList(d){return `<ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`}
function rateBtns(d){
  const r=state.r[d.id];
  return `<button class="btn sm like" data-act="rate" data-id="${d.id}" data-v="1" aria-pressed="${r===1}">Нравится</button><button class="btn sm dis" data-act="rate" data-id="${d.id}" data-v="-1" aria-pressed="${r===-1}">Не моё</button>`;
}
function portionNote(d,p){return d.kind==='batch'?`на ${p} порц.: ${state.eaters===1?'ужин сегодня и завтра':'2 дня на '+state.eaters}`:`на ${p} порц.`}

function nowPool(){
  let pool;
  if(ui.mode==='10')pool=DISHES.filter(d=>(d.kind==='build'||d.kind==='snack'&&!d.fixed)&&d.total<=10);
  else if(ui.mode==='20')pool=DISHES.filter(d=>d.kind==='quick'&&d.total<=30);
  else pool=DISHES.filter(d=>(d.kind==='batch'||d.kind==='quick'||d.id==='s_syrniki')&&d.total-d.active>=15);
  return pool;
}
function pickNow(){
  const pool=nowPool();
  const scored=pool.map(d=>{let w=weight(d);const cv=coverage(d);
    if(d.kind==='build'||d.id==='s_plate'){const rd=d.ings.filter(i=>isReady(i[0]));w*=rd.every(i=>hasKey(i[0]))?5:.25}
    if(ui.fromFridge)w*=.05+cv.ratio*cv.ratio*4;return [d,w]}).filter(x=>x[1]>0&&x[0].id!==ui.nowId);
  if(!scored.length)return pool.find(d=>weight(d)>0)||null;
  let t=scored.reduce((s,x)=>s+x[1],0)*Math.random();for(const [d,w] of scored){if((t-=w)<=0)return d}return scored[0][0];
}
function rNow(){
  const t=today();
  const left=freshFridge().filter(i=>i.k&&i.k.startsWith('dish:'));
  let h='<div class="stack">';
  
  if(left.length)h+=`<div class="note"><b>Сначала доешь.</b> ${left.map(i=>{const dl=diffDays(parse(i.e),t);return `${esc(i.n)}: ${dl<=0?'последний день':'до '+fDm.format(parse(i.e))} <button class="btn sm ghost" data-act="fdel" data-id="${i.id}">Доел</button>`}).join('<br>')}<br><span class="small muted">Разогрей 3–4 минуты в микроволновке под крышкой.</span></div>`;
  const w=state.week;const idx=diffDays(t,parse(w.start));
  if(idx>=0&&idx<7){const s=w.slots[idx];const d=D[s.id];
    h+=`<div class="plan"><div><div class="small muted">По плану сегодня</div><b>${s.role==='left'?'Доедаем: ':''}${d.name}</b></div><button class="btn sm" data-act="open" data-id="${d.id}">Открыть</button></div>`}
  h+=`<div><div class="label" style="margin-bottom:8px">Сколько есть времени</div><div class="seg">
    <button data-act="mode" data-v="10" aria-pressed="${ui.mode==='10'}">10 минут</button>
    <button data-act="mode" data-v="20" aria-pressed="${ui.mode==='20'}">15–20 минут</button>
    <button data-act="mode" data-v="away" aria-pressed="${ui.mode==='away'}">Поставить и уйти</button>
    <button data-act="ff" aria-pressed="${ui.fromFridge}">Из того, что дома</button></div></div>`;
  let d=ui.nowId&&D[ui.nowId]&&nowPool().includes(D[ui.nowId])&&weight(D[ui.nowId])>0?D[ui.nowId]:null;
  if(!d){d=pickNow();ui.nowId=d&&d.id}
  if(!d){h+='<div class="card empty"><p>Под эти условия ничего не осталось: всё в дизлайках или в «Не ем».</p><button class="btn" data-act="tab" data-tab="dishes">Открыть блюда</button></div></div>';return h}
  const p=defaultPortions(d);const cv=coverage(d);
  const needReady=d.ings.filter(i=>isReady(i[0])&&!hasKey(i[0]));
  h+=`<article class="card hero"><div class="kicker">${KIND[d.kind]} · ${d.cui}${isNew(d)?' · новое':''}</div><h2>${d.name}</h2><p class="desc">${d.desc}</p>${metaRow(d,p)}`;
  if(needReady.length)h+=`<p class="small" style="margin-top:10px;color:var(--warn)">Нужна заготовка: ${needReady.map(i=>ingName(i[0]).toLowerCase()).join(', ')}. Её делают в день заготовки.</p>`;
  else if(ui.fromFridge&&cv.miss.length)h+=`<p class="small" style="margin-top:10px;color:var(--warn)">Докупить: ${cv.miss.map(i=>ingName(i[0]).toLowerCase()).join(', ')}</p>`;
  h+=`<details open><summary>Продукты ${portionNote(d,p)}</summary>${ingList(d,p)}</details>${stepsList(d)}
    <div class="actions"><button class="btn" data-act="next">Другое</button>${rateBtns(d)}<button class="btn primary" data-act="cook" data-id="${d.id}">Приготовил</button></div></article>`;
  h+=`<p class="small muted">«Не моё» убирает блюдо из подбора. «Нравится» — будет попадаться чаще. «Приготовил» записывает остатки в холодильник.</p></div>`;
  return h;
}

const ROLE={prep:['Заготовка','b-acc'],left:['Доедаем','b-muted'],batch:['Впрок в мультиварке/духовке','b-acc'],quick:['Быстро','b-muted'],spare:['Запасной день','b-muted']};
function rWeek(){
  const w=state.week;const t=today();const start=parse(w.start);const idx=diffDays(t,start);
  const sh=shopping(w);const pp=prepPlan([w.slots[0].id,...w.extras]);
  let h='<div class="stack">';
  h+=`<div class="dline"><div><h2>Меню на неделю</h2><p class="small muted">с ${fDm.format(start)} · ≈ ${sh.cost.toLocaleString('ru-RU')} ₽ на продукты</p></div><button class="btn sm" data-act="regen">Пересобрать</button></div>`;
  if(idx>6)h+=`<div class="note"><b>Неделя закончилась.</b> Нажми «Пересобрать», чтобы начать новую с сегодняшнего дня.</div>`;
  h+=`<div class="dline"><span class="small muted">Сколько человек ест</span><div class="seg">${[1,2,3].map(n=>`<button data-act="eaters" data-v="${n}" aria-pressed="${state.eaters===n}">${n}</button>`).join('')}</div></div>`;
  h+=`<div class="card"><div class="label">День заготовки · ${fWd.format(start)}, ${fDm.format(start)}</div>
    <h3 style="margin-top:6px">≈ ${hm(pp.total)} на кухне, из них руками ≈ ${pp.active} мин</h3>
    <p class="small muted" style="margin-top:4px">${[w.slots[0].id,...w.extras].map(id=>D[id].name).join(' · ')}</p>
    <details><summary>План по минутам</summary><div class="tl">${pp.placed.map(p=>`<span class="t">${hm(p[0])}</span><span class="${p[3]?'':'pass'}">${p[2]}${p[3]?'':' — само'}</span>`).join('')}</div></details></div>`;
  h+='<div class="card" style="padding-block:4px">';
  w.slots.forEach((s,i)=>{
    const day=addDays(start,i);const d=D[s.id];const ld=D[w.late[i]];
    const isNewD=isNew(d)&&s.role!=='left';
    const loc=sh.local[i]?Object.values(sh.local[i]).map(x=>`${ingName(x.k)} — ${fmtQty(x.q,x.u)}`).join(', '):'';
    const portions=s.role==='left'?0:(d.kind==='batch'?state.eaters*2:state.eaters);
    h+=`<div class="day${i===idx?' today':''}"><div class="dt"><b>${day.getDate()}</b><span>${fWd.format(day)}</span></div><div class="body">
      <div class="dline"><span class="badge ${ROLE[s.role][1]}">${i===idx?'Сегодня · ':''}${ROLE[s.role][0]}</span>${isNewD?'<span class="badge b-new">новое</span>':''}</div>
      <div class="dline"><button class="linkish" data-act="open" data-id="${d.id}">${d.name}</button>${s.role!=='left'?`<button class="btn sm ghost" data-act="swap" data-i="${i}" aria-label="Заменить блюдо">Заменить</button>`:''}</div>
      <div class="sub">${s.role==='left'?'Разогреть 3–4 минуты':`${d.active} мин работы${d.total>d.active?', '+d.total+' всего':''}`} · <b>${d.prot} г белка</b></div>
      ${loc?`<div class="sub" style="color:var(--warn)">По дороге купи: ${loc}</div>`:''}
      <div class="sub">Поздний ужин или перекус: <button class="linkish" style="font-weight:500;font-size:13px;color:var(--muted)" data-act="open" data-id="${ld.id}">${ld.name}${ld.id==='s_muffins'?' из заготовки':''}</button></div>
    </div></div>`;
  });
  h+='</div><p class="small muted">Готовое ешь максимум 2 дня подряд: заготовка закрывает 2 ужина, в середине недели мультиварка делает ещё одну на 2 дня, остальные дни — быстрые блюда на 15–25 минут. Мясо на конец недели лучше купить в магазине у дома: так оно не залежится.</p></div>';
  return h;
}
function rShop(){
  const w=state.week;const sh=shopping(w);const start=parse(w.start);
  const group=(obj,loc)=>{const by={};Object.entries(obj).forEach(([key,x])=>{const s=ING[x.k][1];(by[s]=by[s]||[]).push([key,x])});
    return Object.keys(SEC).filter(s=>by[s]).map(s=>`<div class="sec"><div class="label">${SEC[s]}</div><ul class="shop">${by[s].map(([key,x])=>{const id=loc+'|'+key;const done=!!w.bought[id];
      return `<li class="${done?'done':''}"><label><input type="checkbox" data-act="buy" data-id="${esc(id)}" ${done?'checked':''}><span class="nm">${ingName(x.k)}${hasKey(x.k)?' <span class="badge b-new">есть дома?</span>':''}</span></label><span class="q">${shopQty(x.q,x.u)}</span></li>`}).join('')}</ul></div>`).join('')};
  const all=Object.keys(sh.hyper).length;const done=Object.keys(sh.hyper).filter(k=>w.bought['h|'+k]).length;
  let h=`<div class="stack"><div class="dline"><div><h2>Список покупок</h2><p class="small muted">на неделю с ${fDm.format(start)} · ≈ ${sh.cost.toLocaleString('ru-RU')} ₽ · на ${state.eaters} ${state.eaters===1?'человека':'человек'}</p></div><button class="btn sm" data-act="copy">Скопировать</button></div>`;
  h+=`<div class="card"><div class="dline"><h3>Гипермаркет, в день заготовки</h3><span class="small muted">${done} из ${all}</span></div><div class="bar"><i style="width:${all?done/all*100:0}%"></i></div><div style="margin-top:12px">${group(sh.hyper,'h')}</div></div>`;
  const days=Object.keys(sh.local).map(Number).sort((a,b)=>a-b);
  if(days.length){h+=`<div class="card"><h3>Магазин у дома, ближе к делу</h3><p class="small muted" style="margin-top:4px">Это скоропортящееся. Купи в день готовки или заморозь сразу после гипермаркета и достань в холодильник накануне.</p>`;
    days.forEach(dd=>{h+=`<div class="sec" style="margin-top:14px"><div class="label">${fWd.format(addDays(start,dd))}, ${fDm.format(addDays(start,dd))}</div>${group(sh.local[dd],'l'+dd).replace(/<div class="sec">/g,'<div>')}</div>`});h+='</div>'}
  if(sh.pantry.length)h+=`<div class="card"><h3>Проверь в кладовке</h3><p class="small muted" style="margin-top:4px">Обычно уже есть дома.</p><div class="chips" style="margin-top:10px">${sh.pantry.map(k=>`<span class="badge">${ingName(k)}</span>`).join('')}</div></div>`;
  h+='<div id="copybox"></div></div>';
  return h;
}
function shopText(){
  const w=state.week;const sh=shopping(w);const start=parse(w.start);
  let s='Гипермаркет:\n'+Object.values(sh.hyper).map(x=>'— '+ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n');
  Object.keys(sh.local).map(Number).sort((a,b)=>a-b).forEach(dd=>{s+='\n\nУ дома, '+fWd.format(addDays(start,dd))+' '+fDm.format(addDays(start,dd))+':\n'+Object.values(sh.local[dd]).map(x=>'— '+ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n')});
  if(sh.pantry.length)s+='\n\nПроверить дома: '+sh.pantry.map(ingName).join(', ');
  return s;
}
function rFridge(){
  const t=today();
  const items=[...state.fridge].sort((a,b)=>(a.z-b.z)||a.e.localeCompare(b.e));
  let h='<div class="stack"><h2>Холодильник</h2>';
  if(!items.length)h+='<div class="card empty"><p class="muted">Пока пусто. Отметь ниже, что купил или приготовил, и здесь появятся сроки и идеи, что из этого сделать.</p></div>';
  else{h+='<div class="card" style="padding-block:4px"><div class="list">'+items.map(i=>{
    const dl=diffDays(parse(i.e),t);let b;
    if(i.z)b='<span class="badge">морозилка</span>';else if(dl<0)b='<span class="badge b-danger">просрочено</span>';else if(dl===0)b='<span class="badge b-warn">сегодня</span>';else if(dl===1)b='<span class="badge b-warn">до завтра</span>';else b=`<span class="badge b-new">ещё ${dl} дн.</span>`;
    return `<div class="item" style="flex-wrap:wrap;gap:8px 10px"><div class="grow" style="flex-basis:100%"><div style="font-weight:500">${esc(i.n)}</div><div class="small muted">с ${fDm.format(parse(i.a))}</div></div>${b}<span style="flex:1"></span><button class="btn sm ghost" data-act="${i.z?'thaw':'freeze'}" data-id="${i.id}">${i.z?'Разморозить':'В морозилку'}</button><button class="btn sm" data-act="fdel" data-id="${i.id}" aria-label="Убрать">Убрать</button></div>`}).join('')+'</div></div>';
    const ranked=DISHES.filter(d=>d.kind!=='base'&&weight(d)>0).map(d=>[d,coverage(d)]).filter(x=>x[1].have.length>0).sort((a,b)=>b[1].ratio-a[1].ratio||b[1].have.length-a[1].have.length).slice(0,6);
    if(ranked.length)h+=`<div class="card"><h3>Что приготовить из этого</h3><div class="list" style="margin-top:6px">${ranked.map(([d,cv])=>`<div class="item"><div class="grow"><button class="linkish" data-act="open" data-id="${d.id}">${d.name}</button><div class="small muted">${cv.miss.length?'докупить: '+cv.miss.map(i=>ingName(i[0]).toLowerCase()).join(', '):'всё есть'}</div></div><span class="badge ${cv.ratio===1?'b-new':''}">${cv.have.length} из ${cv.need.length}</span></div>`).join('')}</div></div>`;
  }
  h+=`<div class="card"><div class="label">Добавить</div><div class="seg" style="margin-top:10px"><button data-act="place" data-v="fridge" aria-pressed="${ui.place==='fridge'}">В холодильник</button><button data-act="place" data-v="freezer" aria-pressed="${ui.place==='freezer'}">В морозилку</button></div>
    <div class="chips" style="margin-top:12px">${FRIDGE_PRESETS.map(k=>`<button class="chip" data-act="fadd" data-k="${k}">${ingName(k)}</button>`).join('')}</div>
    <form class="addrow" id="faddForm" style="margin-top:12px"><input id="fname" placeholder="Что-то своё, например «гуляш от мамы»" autocomplete="off"><button class="btn" type="submit">Добавить</button></form>
    <p class="small muted" style="margin-top:8px">Срок ставится сам: сырой фарш 1 день, курица 2, готовое 2, морозилка 3 месяца.</p></div>`;
  h+='</div>';return h;
}
function rDishes(){
  const rateable=DISHES.filter(d=>d.kind!=='base');
  const unrated=rateable.filter(d=>state.r[d.id]===undefined);
  const cur=unrated[0];
  let h='<div class="stack"><h2>Блюда</h2>';
  h+=`<div class="card"><div class="label">Знакомство</div>`;
  if(cur){h+=`<p class="small muted" style="margin-top:4px">Не помнишь, что не любишь? Пройдись по списку: так генератор быстрее поймёт вкус.</p>
    <div style="margin-top:14px"><div class="kicker">${KIND[cur.kind]}</div><h3 style="font-size:18px">${cur.name}</h3><p class="desc small">${cur.desc}</p></div>
    <div class="actions"><button class="btn" data-act="deck" data-id="${cur.id}" data-v="-1">Не моё</button><button class="btn" data-act="deck" data-id="${cur.id}" data-v="0">Не знаю</button><button class="btn primary" data-act="deck" data-id="${cur.id}" data-v="1">Хочу</button></div>`}
  else h+=`<p style="margin-top:6px">Все блюда оценены. Оценки можно поменять в списке ниже.</p>`;
  h+=`<div class="bar"><i style="width:${(rateable.length-unrated.length)/rateable.length*100}%"></i></div><p class="small muted" style="margin-top:6px">оценено ${rateable.length-unrated.length} из ${rateable.length}</p></div>`;
  h+=`<div class="card"><div class="label">Не ем</div><p class="small muted" style="margin-top:4px">Блюда с отмеченными продуктами пропадут из подбора.</p><div class="chips" style="margin-top:10px">${BANNABLE.map(k=>`<button class="chip ban" data-act="ban" data-k="${k}" aria-pressed="${state.ban.includes(k)}">${ingName(k)}</button>`).join('')}</div></div>`;
  const F={all:'Все',batch:'Заготовка',quick:'Быстро',build:'Из заготовки',snack:'Перекусы'};
  h+=`<div class="seg">${Object.entries(F).map(([k,v])=>`<button data-act="filter" data-v="${k}" aria-pressed="${ui.filter===k}">${v}</button>`).join('')}</div>`;
  const list=rateable.filter(d=>ui.filter==='all'||d.kind===ui.filter);
  h+=`<div class="card" style="padding-block:4px"><div class="list">${list.map(d=>`<div class="item" style="flex-wrap:wrap"><div class="grow" style="min-width:180px"><button class="linkish" data-act="open" data-id="${d.id}">${d.name}</button><div class="small muted">${KIND[d.kind]} · ${d.total} мин · ${d.prot} г белка${state.c[d.id]?' · готовил '+state.c[d.id]+' р.':''}${isBanned(d)?' · <span style="color:var(--danger)">есть «не ем»</span>':''}</div></div><div style="display:flex;gap:6px">${rateBtns(d)}</div></div>`).join('')}</div></div>`;
  h+=`<div class="card tip"><h3>Что докупить на 10 тысяч</h3><ol>
    <li><b>Аэрогриль на 5–6 литров</b>, примерно 6–9 тыс. ₽. Курица, котлеты и картошка дольками за 20–25 минут без масла: положил, закрыл, ушёл. Заменяет духовку для 1–2 порций.</li>
    <li><b>Стеклянные контейнеры с крышками</b>, 6–8 штук, около 1,5 тыс. ₽. Заготовку видно, греется прямо в них.</li>
    <li><b>Термометр-щуп</b>, около 700 ₽. Курица готова при 74°, фарш при 71°. Не надо резать и гадать.</li></ol></div>`;
  h+=`<div class="card"><div class="dline" style="align-items:center"><span class="small muted">Сбросить оценки, холодильник и меню</span><button class="btn sm" data-act="reset" style="${ui.resetArm?'color:var(--danger);border-color:var(--danger)':''}">${ui.resetArm?'Точно сбросить?':'Сбросить'}</button></div></div>`;
  h+='</div>';return h;
}
function openSheet(d){
  const p=defaultPortions(d);
  document.getElementById('sheetIn').innerHTML=`<button class="btn sm sheet-x" data-act="close" aria-label="Закрыть">Закрыть</button><div class="kicker">${KIND[d.kind]} · ${d.cui}</div><h2>${d.name}</h2><p class="desc">${d.desc}</p>${metaRow(d,p)}
    <details open><summary>Продукты ${portionNote(d,p)}</summary>${ingList(d,p)}</details>${stepsList(d)}
    <div class="actions">${rateBtns(d)}<button class="btn primary" data-act="cook" data-id="${d.id}">Приготовил</button></div>`;
  const dlg=document.getElementById('sheet');if(!dlg.open)dlg.showModal();
}
let toastT;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const id=b.dataset.id;
  if(a!=='reset')ui.resetArm=false;
  const sheet=document.getElementById('sheet');const inSheet=sheet.contains(b);
  switch(a){
    case 'tab':ui.tab=b.dataset.tab;saveUi();render();window.scrollTo(0,0);break;
    case 'mode':ui.mode=b.dataset.v;ui.nowId=null;saveUi();render();break;
    case 'ff':ui.fromFridge=!ui.fromFridge;ui.nowId=null;render();break;
    case 'next':ui.nowId=(pickNow()||{}).id;render();break;
    case 'rate':{const v=Number(b.dataset.v);if(state.r[id]===v)delete state.r[id];else state.r[id]=v;save();render();if(inSheet)openSheet(D[id]);
      if(v===-1&&state.r[id]===-1&&!inSheet&&ui.tab==='now'){ui.nowId=(pickNow()||{}).id;render()}break}
    case 'deck':{const v=Number(b.dataset.v);state.r[id]=v;save();render();break}
    case 'cook':markCooked(D[id]);if(inSheet)sheet.close();break;
    case 'open':openSheet(D[id]);break;
    case 'close':sheet.close();break;
    case 'regen':state.week=genWeek();save();render();toast('Новое меню собрано');break;
    case 'swap':replaceSlot(Number(b.dataset.i));break;
    case 'eaters':state.eaters=Number(b.dataset.v);save();render();break;
    case 'copy':{const txt=shopText();const done=()=>toast('Список скопирован');
      const fallback=()=>{const box=document.getElementById('copybox');box.innerHTML='<textarea class="copy" readonly></textarea>';const ta=box.firstChild;ta.value=txt;ta.focus();ta.select();toast('Выделил текст, скопируй вручную')};
      try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}break}
    case 'place':ui.place=b.dataset.v;render();break;
    case 'fadd':{const k=b.dataset.k;const t=today();const z=ui.place==='freezer';
      state.fridge.push({id:rid(),k,n:ingName(k),a:iso(t),e:iso(addDays(t,z?90:ING[k][2])),z});save();render();toast('Добавил: '+ingName(k).toLowerCase());break}
    case 'fdel':state.fridge=state.fridge.filter(i=>i.id!==id);save();render();break;
    case 'freeze':{const i=state.fridge.find(x=>x.id===id);if(i){i.z=true;i.e=iso(addDays(today(),90))}save();render();break}
    case 'thaw':{const i=state.fridge.find(x=>x.id===id);if(i){i.z=false;i.e=iso(addDays(today(),1))}save();render();toast('Разморозь в холодильнике, срок — до завтра');break}
    case 'ban':{const k=b.dataset.k;state.ban=state.ban.includes(k)?state.ban.filter(x=>x!==k):[...state.ban,k];save();render();break}
    case 'filter':ui.filter=b.dataset.v;render();break;
    case 'reset':if(!ui.resetArm){ui.resetArm=true;render()}else{state=blank();state.week=genWeek();ui.resetArm=false;save();render();toast('Всё сброшено')}break;
  }
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-act="buy"]');if(!c)return;
  const w=state.week;if(c.checked)w.bought[c.dataset.id]=true;else delete w.bought[c.dataset.id];save();render();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='faddForm')return;e.preventDefault();
  const v=document.getElementById('fname').value.trim();if(!v)return;
  const t=today();const z=ui.place==='freezer';
  state.fridge.push({id:rid(),k:null,n:v.slice(0,60),a:iso(t),e:iso(addDays(t,z?90:2)),z});save();render();toast('Добавил: '+v.slice(0,40));
});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.close()});

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>
