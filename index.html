const HALF=new Set(['onion','carrot','tomatoes','bell_pepper','zucchini','eggplant','cucumbers','beet','potato','greens','canned_tomatoes','tushenka','chickpeas','beans','corn','peas','lemon','cooked_grain']);
function rq(v,u){return v>=1000?num(Math.round(v/100)/10)+(u==='г'?' кг':' л'):Math.max(10,Math.round(v/10)*10)+' '+u}
function recipeQty(k,q,u){
  if(u==='г'||u==='мл')return rq(q,u);
  if(isSpoon(u))return frac(Math.max(.25,Math.round(q*4)/4))+' '+u;
  if(!HALF.has(k))return fmtQty(Math.max(1,Math.round(q)),u);
  const v=k==='lemon'?Math.max(.25,Math.round(q*4)/4):Math.max(.5,Math.round(q*2)/2);if(v%1===0)return fmtQty(v,u);
  const G={'пучок':'пучка','банка':'банки','головка':'головки'}[u];return frac(v)+' '+(G||u);
}
function plural(n,a,b,c){const m=n%100,l=n%10;return m>10&&m<20?c:l===1?a:l>=2&&l<=4?b:c}
function frac(v){const w=Math.floor(v+1e-9),r=Math.round((v-w)*4);return (w||!r?String(w):'')+(['','¼','½','¾'][r]||'')}
function scaleStep(t,k){
  return t.replace(/\{([\d.,]+)([hc]?)(?:\|([^|}]+)\|([^|}]+)\|([^}]+))?\}(\s*(?:ч\.л\.|ст\.л\.|мл|л|г)(?![а-яё]))?/g,(m,n,h,a,b,c,u)=>{
    let v=parseFloat(n.replace(',','.'))*k;u=u||'';const unit=u.trim();
    if(h==='c')v=Math.min(5,Math.max(1.5,Math.round(v*2)/2));
    if(a){if(h&&v<1.75){v=Math.max(.5,Math.round(v*2)/2);if(v%1)return frac(v)+' '+b}v=Math.max(1,Math.round(v));return v+' '+plural(v,a,b,c)}
    if(unit==='ч.л.'||unit==='ст.л.')return frac(Math.max(.25,Math.round(v*4)/4))+u;
    if(unit==='мл'||unit==='г')return rq(v,unit);
    if(unit==='л'){if(v<1)return Math.max(300,Math.round(v*1000/50)*50)+' мл';return num(Math.round(v*10)/10)+u}
    return num(Math.round(v*10)/10)+u});
}
function stepK(d,p){return d.fixed||!p?1:p/d.serves}
function goalF(d,k){if(!goalOn()||d.fixed||d.kind==='base')return 1;const pl=plate(d);return pl.fr*(pl.cut&&GARN.has(k)?1-pl.cut:1)}
function isGarnStep(t){return /^(Сначала поставь гарнир|Параллельно свари гарнир|Налей в большую кастрюлю)/.test(t)}
function stepText(d,i,p){const t=d.steps[i];return scaleStep(t,stepK(d,p)*goalF(d,isGarnStep(t)?'rice':''))}
function toolsLine(d){return d.tools?`<p class="small tools"><b>Посуда:</b> ${d.tools.join(', ')}</p>`:''}
function stepsOl(d,p,from,to){return `<ol class="steps" style="counter-reset:st ${from}">${d.steps.slice(from,to).map((s,i)=>`<li>${stepText(d,from+i,p)}</li>`).join('')}</ol>`}
function bigNote(d,p){const k=stepK(d,p);
  if(d.big&&k>=1.4)return d.big;
  if(d.kind==='build'&&p>1)return 'Шаги — на одну тарелку. Собери так же каждому, греть можно по очереди.';
  if(d.kind==='lunch'&&p>1)return 'Шаги — на один контейнер. Собери так же каждому.';
  if(d.tool==='мультиварка'&&k>=1.7)return 'Продуктов много: проверь, что в чаше всё ниже отметки MAX. Если не влезает — раздели на две закладки. Тушение может занять на 10–15 минут дольше, смотри на признаки готовности.';
  if(d.tool==='плита'&&k>=1.4)return 'Продуктов много: бери самую большую сковороду или готовь в 2 захода. Мясо, если выложить всё сразу, потушится, а не обжарится.';
  if(d.tool==='духовка'&&k>=1.6)return 'Если всё не ложится в одну форму одним слоем — возьми вторую форму или противень. Время то же.';
  return ''}
function ingsBlock(d,p,key){return `<details class="fold sub" data-fold="${key}"${fold(key,true)}><summary><b>Продукты ${portionNote(d,p)}</b></summary>${ingList(d,p)}</details>`}
function stepsList(d,p,key,def){const n=bigNote(d,p);
  return `<details class="fold sub" data-fold="${key}"${fold(key,def)}><summary><b>Как готовить</b><span class="small muted">${d.steps.length} ${plural(d.steps.length,'шаг','шага','шагов')}</span></summary>${n?`<p class="small note" style="margin:10px 0 0">${n}</p>`:''}${toolsLine(d)}${d.mise?`<p class="steps-h">До плиты — подготовь всё заранее</p>${stepsOl(d,p,0,d.mise)}<p class="steps-h">${d.tool==='духовка'?'Готовка':'На плите'}</p>${stepsOl(d,p,d.mise,d.steps.length)}`:stepsOl(d,p,0,d.steps.length)}${helpBlocks(d,d.steps.join(' '),false)}</details>`}
const pplMult=d=>d.kind==='batch'?2:1;
function pplOf(d,p){const n=p/pplMult(d);return Number.isInteger(n)&&n>=1&&n<=3?n:0}
function curP(d,day){const n=ui.ppl[d.id];return n&&!d.fixed&&d.kind!=='base'?n*pplMult(d):portionsFor(d,day)}
function pplPicker(d,p,ctx){if(d.fixed||d.kind==='base')return '';const cur=pplOf(d,p);
  return `<div class="ppl"><span class="label">На сколько человек</span><div class="seg">${[1,2,3].map(n=>`<button data-act="ppl" data-id="${d.id}" data-ctx="${ctx}" data-v="${n}" aria-pressed="${n===cur}">${n}</button>`).join('')}</div></div>`}
function portionNote(d,p){const n=pplOf(d,p),pp=num(p);
  if(d.fixed)return `на ${pp} порц.`;
  if(d.kind==='batch')return n?`на ${n} чел. на 2 дня (${pp} порц.)`:`на ${pp} порц. на 2 дня`;
  return n?`на ${n} чел.`:`на ${pp} порц.`}
function nowPool(){
  if(ui.mode==='10')return DISHES.filter(d=>(d.kind==='build'||d.kind==='lunch'||d.kind==='snack'&&!d.fixed)&&d.total<=10);
  if(ui.mode==='20')return DISHES.filter(d=>d.kind==='quick'&&d.total<=30);
  return DISHES.filter(d=>(d.kind==='batch'||d.kind==='quick'||d.id==='s_syrniki')&&d.total-d.active>=15);
}
function pickNow(){
  const pool=nowPool();
  const scored=pool.map(d=>{let w=weight(d);const cv=coverage(d);
    if(d.kind==='build'||d.id==='s_plate'){const rd=d.ings.filter(i=>isReady(i[0]));w*=rd.every(i=>hasKey(i[0]))?5:.25}
    if(ui.fromFridge)w*=.05+cv.ratio*cv.ratio*4;return [d,w]}).filter(x=>x[1]>0&&x[0].id!==ui.nowId);
  if(!scored.length)return pool.find(d=>weight(d)>0)||null;
  let t=scored.reduce((s,x)=>s+x[1],0)*Math.random();for(const [d,w] of scored){if((t-=w)<=0)return d}return scored[0][0];
}
function backupDue(){
  const amount=Object.keys(state.r).length+state.fridge.length+Object.keys(state.c).length;
  return amount>=5&&(!state.lastBackup||diffDays(today(),parse(state.lastBackup))>=14);
}
function shopText(){
  const w=state.week;const sh=shopping(w);const start=parse(w.start);
  let s='Гипермаркет:\n'+Object.values(sh.hyper).map(x=>'— '+ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n');
  Object.keys(sh.local).map(Number).sort((a,b)=>a-b).forEach(dd=>{s+='\n\nУ дома, '+fWd.format(addDays(start,dd))+' '+fDm.format(addDays(start,dd))+':\n'+Object.values(sh.local[dd]).map(x=>'— '+ingName(x.k)+' — '+shopQty(x.q,x.u)).join('\n')});
  if(sh.pantry.length)s+='\n\nПроверить дома: '+sh.pantry.map(ingName).join(', ');
  return s;
}

function goTab(tab,anim){

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'){importFile(t);return}
  if(t.id==='dsort'){ui.sort=t.value;saveUi();document.getElementById('dishList').innerHTML=dishListHtml();return}
  if(t.matches('select[data-cal]')){state.cal[t.dataset.cal]=Number(t.value);save();return}
  if(t.matches('[data-act="goalon"]')){
    const prev=JSON.stringify(state);state.goal.on=t.checked;state.week=genWeek();save();render();refreshSheet();toast(t.checked?'Цель включена, меню пересобрано под неё':'Цель выключена, меню пересобрано',prev);return}
  if(t.matches('input[data-price]')){const k=t.dataset.price,v=Number(String(t.value).replace(',','.'));
    if(v>0&&v!==PRICE[k][0])state.prices[k]=v;else delete state.prices[k];t.value=priceOf(k);save();
    const el=document.getElementById('shopTotal');if(el)el.textContent=shopping(state.week).cost.toLocaleString('ru-RU');return}
  if(!t.matches('[data-act="buy"]'))return;
  const w=state.week;const id=t.dataset.id;
  if(t.checked){const x=findShopItem(id);let rec=true;
    if(x){const t0=today();const same=state.fridge.find(i=>i.k===x.k&&!i.z&&isFresh(i,t0));
      if(same&&isSpoon(x.u))rec={f:same.id,q:0};
      else if(same&&same.q!=null&&same.u===x.u){same.q+=x.q;same.e=iso(addDays(t0,ING[x.k][2]));rec={f:same.id,q:x.q}}
      else if(same&&same.q==null&&!isSpoon(x.u)){same.q=x.q;same.u=x.u;same.e=iso(addDays(t0,ING[x.k][2]));rec={f:same.id,q:0}}
      else rec={f:addFridge(x.k,ingName(x.k),ING[x.k][2],false,x.q,x.u).id,q:x.q,n:1}}
    w.bought[id]=rec}
  else{const rec=w.bought[id];
    if(typeof rec==='string')state.fridge=state.fridge.filter(i=>i.id!==rec);
    else if(rec&&rec.f){const it=state.fridge.find(i=>i.id===rec.f);
      if(it){if(rec.q&&it.q!=null){it.q-=rec.q;if(it.q<tiny(it.u))state.fridge=state.fridge.filter(i=>i.id!==rec.f)}else if(rec.n)state.fridge=state.fridge.filter(i=>i.id!==rec.f)}}
    delete w.bought[id]}
  save();const y=window.scrollY;render();window.scrollTo(0,y);
});

/* жесты: смахнуть лист вниз, листать вкладки и шаги */
(()=>{const box=document.getElementById('sheetIn');let y0=null,dy=0,drag=false;
  box.addEventListener('touchstart',e=>{if(e.touches.length>1||(box.scrollTop>0&&!e.target.closest('.grab'))){y0=null;return}y0=e.touches[0].clientY;dy=0;drag=false},{passive:true});
  box.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>10&&(box.scrollTop<=0||drag)){drag=true;sheetEl.style.transition='none';sheetEl.style.transform=`translateY(${Math.max(0,dy-10)}px)`}else if(dy<-4&&!drag)y0=null},{passive:true});
  box.addEventListener('touchend',()=>{if(drag){sheetEl.style.transition='transform .22s ease';if(dy>120){sheetEl.style.transform='translateY(100%)';setTimeout(()=>{closeSheet();sheetEl.style.transition=''},200)}else{sheetEl.style.transform='';setTimeout(()=>sheetEl.style.transition='',230)}}y0=null;drag=false},{passive:true});
})();
function swipe(el,ok,fn){let sx=null,sy=0,st=0,tg=null;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];if(e.touches.length>1||t.clientX<24||t.clientX>window.innerWidth-24||!ok(e)){sx=null;return}sx=t.clientX;sy=t.clientY;st=Date.now();tg=e.target},{passive:true});
  el.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*.5&&Date.now()-st<700)fn(dx<0?1:-1,tg)},{passive:true});
}
swipe(view,e=>!e.target.closest('.scroller,input,textarea,select,.seg'),(dir,tg)=>{if(ui.tab==='week'&&tg&&tg.closest('.daycard,.dstrip')){ui.wday=Math.max(0,Math.min(6,(ui.wday||0)+dir));render();return}const i=TABS.indexOf(ui.tab)+dir;if(i>=0&&i<TABS.length)goTab(TABS[i])});
swipe(document.getElementById('cook'),e=>!e.target.closest('button,.chips'),dir=>{if(!cook)return;const n=D[cook.id].steps.length;cook.step=Math.max(-1,Math.min(n-1,cook.step+dir));saveCook();renderCook()});

document.getElementById('setBtn').innerHTML=ICON.gear;
render();
if(cook){renderCook();lockScreen();ensureTick()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
const swVer=()=>fetch('sw.js?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>(t.match(/CACHE='([^']+)'/)||[])[1]||null).catch(()=>null);
let appVer=null,lastDay=iso(today());swVer().then(v=>appVer=v);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;
  if(iso(today())!==lastDay){lastDay=iso(today());ui.nowId=null;ui.wday=null;render()}else renderChrome();
  if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
  swVer().then(v=>{if(v&&appVer&&v!==appVer&&!document.querySelector('dialog[open]'))location.reload()})});
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>
</body>
</html>
